<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午夜影院 - 无声沉沦</title>
    <style>
        /* ====== 柔和配色方案：烟紫灰与干枯玫瑰 ====== */
        body {
            margin: 0;
            padding: 8vh 0; 
            box-sizing: border-box;
            background-color: #1e1b1e;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(180, 120, 130, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(80, 60, 70, 0.25) 0%, transparent 60%);
            color: #eae3e0; 
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            cursor: pointer;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            text-align: center;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .film-grain {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04; 
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(15, 10, 12, 0.6) 120%);
            pointer-events: none;
            z-index: 50;
        }

        .letterbox-top, .letterbox-bottom {
            position: fixed;
            left: 0; right: 0;
            height: 6vh;
            background: #141112; 
            z-index: 100;
            pointer-events: none;
        }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vh;
            background: radial-gradient(ellipse, rgba(200, 130, 140, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .bokeh {
            position: fixed;
            border-radius: 50%;
            background: rgba(230, 190, 190, 0.06);
            box-shadow: 0 0 15px rgba(230, 190, 190, 0.05);
            pointer-events: none;
            animation: drift linear infinite;
            z-index: 2;
        }
        .b1 { width: 20px; height: 20px; left: 15%; bottom: 20%; animation-duration: 25s; }
        .b2 { width: 10px; height: 10px; right: 20%; top: 30%; animation-duration: 35s; animation-direction: reverse; }
        .b3 { width: 25px; height: 25px; left: 65%; bottom: 15%; animation-duration: 30s; }

        @keyframes drift {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
        }

        /* ====== 开始页样式 ====== */
        #start-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            background-color: #1a1617;
            background-image: radial-gradient(circle at center, rgba(160, 100, 110, 0.08) 0%, transparent 60%);
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default; /* 防止开始页全局误触 */
        }

        #start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .start-title {
            font-size: 3.5em;
            letter-spacing: 25px;
            margin-right: -25px; 
            color: rgba(245, 235, 230, 0.95);
            font-family: "Didot", "Songti SC", "Times New Roman", serif;
            text-shadow: 0 0 30px rgba(210, 160, 160, 0.4);
            font-weight: 300;
            animation: floatTitle 4s ease-in-out infinite alternate;
        }

        .start-subtitle {
            font-size: 1.1em;
            letter-spacing: 12px;
            margin-right: -12px;
            color: rgba(210, 160, 160, 0.85);
            font-weight: 300;
            margin-top: 25px;
        }

        .start-warning {
            font-size: 0.75em;
            letter-spacing: 4px;
            margin-right: -4px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 40px;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 密码输入框区域 */
        .password-container {
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 301;
        }

        #ticket-code {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(210, 160, 160, 0.4);
            color: rgba(245, 235, 230, 0.9);
            padding: 12px 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9em;
            letter-spacing: 5px;
            text-align: center;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
            width: 220px;
            box-sizing: border-box;
        }

        #ticket-code:focus {
            border-color: rgba(210, 160, 160, 0.9);
            box-shadow: 0 0 15px rgba(210, 160, 160, 0.2);
        }

        #ticket-code::placeholder {
            color: rgba(210, 160, 160, 0.3);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            letter-spacing: 2px;
            font-size: 0.8em;
        }

        .error-msg {
            color: #d9666f;
            font-size: 0.7em;
            letter-spacing: 2px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 15px; /* 占位防止跳动 */
        }

        .error-msg.show {
            opacity: 1;
        }

        .start-btn {
            margin-top: 20px;
            padding: 12px 45px;
            background: transparent;
            border: 1px solid rgba(210, 160, 160, 0.5);
            color: rgba(210, 160, 160, 0.9);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 0.85em;
            letter-spacing: 6px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            background: rgba(210, 160, 160, 0.15);
            border-color: rgba(210, 160, 160, 0.9);
            box-shadow: 0 0 20px rgba(210, 160, 160, 0.25);
            color: rgba(255, 255, 255, 1);
        }

        @keyframes floatTitle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        /* ====== 主游戏容器 ====== */
        #game-container {
            width: 85%;
            max-width: 800px;
            margin: auto;
            padding: 80px 60px; 
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 50vh;
            
            /* 初始状态隐藏，等待开始页结束 */
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 2s ease-in-out, transform 2s ease-in-out;
        }

        .corner-anchor {
            position: absolute;
            width: 25px;
            height: 25px;
            pointer-events: none;
        }
        .corner-anchor::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            border-color: rgba(210, 160, 160, 0.5);
            border-style: solid;
        }
        .corner-anchor::after {
            content: "";
            position: absolute;
            width: 4px; height: 4px;
            background: #e6b8b8;
            border-radius: 50%;
            box-shadow: 0 0 6px #e6b8b8;
        }
        .corner-anchor.tl { top: -1px; left: -1px; }
        .corner-anchor.tl::before { border-width: 1px 0 0 1px; }
        .corner-anchor.tl::after { top: -2px; left: -2px; }
        .corner-anchor.tr { top: -1px; right: -1px; }
        .corner-anchor.tr::before { border-width: 1px 1px 0 0; }
        .corner-anchor.tr::after { top: -2px; right: -2px; }
        .corner-anchor.bl { bottom: -1px; left: -1px; }
        .corner-anchor.bl::before { border-width: 0 0 1px 1px; }
        .corner-anchor.bl::after { bottom: -2px; left: -2px; }
        .corner-anchor.br { bottom: -1px; right: -1px; }
        .corner-anchor.br::before { border-width: 0 1px 1px 0; }
        .corner-anchor.br::after { bottom: -2px; right: -2px; }

        .top-ornament {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }
        .top-ornament span {
            color: rgba(210, 160, 160, 0.8);
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 6px;
        }
        .top-ornament::before, .top-ornament::after {
            content: "";
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(210, 160, 160, 0.5), transparent);
        }

        #story-text {
            width: 100%;
            font-size: 0.95em; 
            line-height: 2.2;
            letter-spacing: 2px;
            color: #f7f2ef;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
            text-align: center; 
            margin-bottom: 50px;
            margin-top: 15px;
            font-weight: 300;
        }

        #prompt-box {
            position: relative;
            width: 85%; 
            padding: 25px 0;
            text-align: center; 
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(ellipse at center, rgba(210, 160, 160, 0.08) 0%, transparent 70%);
        }
        #prompt-box::before, #prompt-box::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(210, 160, 160, 0.4), transparent);
        }
        #prompt-box::before { top: 0; }
        #prompt-box::after { bottom: 0; }
        #prompt-box.show {
            opacity: 1;
        }

        #prompt-text {
            width: 100%;
            color: rgba(220, 175, 175, 0.85); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.8em; 
            line-height: 2;
            letter-spacing: 3px;
            margin: 0;
            font-style: italic;
            font-weight: 300;
            text-align: center; 
            min-height: 2em;
        }

        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #choices-container.show {
            opacity: 1;
            pointer-events: auto;
        }

        .choice-btn {
            background: transparent;
            border: 1px solid rgba(210, 160, 160, 0.4);
            color: rgba(220, 180, 180, 0.9);
            padding: 12px 25px;
            font-family: "Noto Serif SC", serif;
            font-size: 0.95em;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-align: center;
            outline: none;
            position: relative;
            overflow: hidden;
        }
        .choice-btn:hover {
            background: rgba(210, 160, 160, 0.1);
            border-color: rgba(210, 160, 160, 0.8);
            color: #fff;
            box-shadow: 0 0 15px rgba(210, 160, 160, 0.2);
        }

        #click-hint {
            position: fixed;
            bottom: 2vh; 
            z-index: 101;
            font-size: 0.65em;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            width: 100%;
            opacity: 0; 
            transition: opacity 1s ease;
        }

        .rec-dot {
            width: 5px;
            height: 5px;
            background-color: #d9666f; 
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(217, 102, 111, 0.6);
            animation: rec-blink 2s infinite;
        }

        @keyframes rec-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ====== 谢幕页 ====== */
        #end-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            background-color: #1a1617;
            background-image: radial-gradient(circle at center, rgba(160, 100, 110, 0.08) 0%, transparent 60%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #end-screen.show {
            opacity: 1;
            pointer-events: auto;
        }

        .end-title {
            font-size: 4em;
            letter-spacing: 30px;
            margin-right: -30px; 
            color: rgba(245, 235, 230, 0.95);
            font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
            text-shadow: 0 0 30px rgba(210, 160, 160, 0.4);
            font-weight: 300;
            opacity: 0;
            transform: scale(1.05); 
        }
        #end-screen.show .end-title {
            animation: endFadeIn 2.5s ease-out 0.5s forwards;
        }

        .end-divider {
            width: 0px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(210, 160, 160, 0.7), transparent);
            margin: 35px 0;
            opacity: 0;
        }
        #end-screen.show .end-divider {
            animation: lineExpand 2.5s ease-out 1.5s forwards;
        }

        .end-subtitle {
            font-size: 0.95em;
            letter-spacing: 12px;
            margin-right: -12px;
            color: rgba(210, 160, 160, 0.85);
            font-weight: 300;
            opacity: 0;
        }
        #end-screen.show .end-subtitle {
            animation: endFadeIn 2.5s ease-out 2.5s forwards;
        }

        .replay-btn {
            margin-top: 70px;
            padding: 12px 40px;
            background: transparent;
            border: 1px solid rgba(210, 160, 160, 0.5);
            color: rgba(210, 160, 160, 0.9);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 0.85em;
            letter-spacing: 6px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px);
        }
        #end-screen.show .replay-btn {
            animation: btnFadeIn 2s ease-out 3.5s forwards;
        }
        .replay-btn:hover {
            background: rgba(210, 160, 160, 0.15);
            border-color: rgba(210, 160, 160, 0.9);
            box-shadow: 0 0 20px rgba(210, 160, 160, 0.25);
            color: rgba(255, 255, 255, 1);
        }

        .movie-credits {
            position: absolute;
            bottom: 4vh;
            font-family: "Arial", sans-serif;
            font-size: 0.55em;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0.95) scaleX(0.85); 
        }
        #end-screen.show .movie-credits {
            animation: endFadeIn 3s ease-out 4.5s forwards;
        }

        @keyframes endFadeIn {
            to { opacity: 1; transform: scale(1) scaleX(1); }
        }
        @keyframes btnFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes lineExpand {
            to { width: 180px; opacity: 1; }
        }

        @media screen and (max-width: 600px) {
            .start-title { font-size: 2.5em; letter-spacing: 15px; margin-right: -15px; }
            .start-subtitle { font-size: 0.9em; letter-spacing: 8px; margin-right: -8px; }
            .start-warning { font-size: 0.6em; letter-spacing: 2px; }

            #ticket-code { width: 180px; font-size: 0.8em; padding: 10px 15px;}
            .error-msg { font-size: 0.65em; }

            #game-container {
                width: 90%;
                padding: 60px 25px 40px 25px; 
                margin: auto; 
            }
            .top-ornament { top: 20px; }
            .top-ornament span { font-size: 9px; letter-spacing: 4px; }
            .top-ornament::before, .top-ornament::after { width: 20px; }
            #story-text { font-size: 0.85em; line-height: 2; letter-spacing: 1.5px; margin-bottom: 40px; } 
            #prompt-box { width: 95%; padding: 20px 0; }
            #prompt-text { font-size: 0.75em; letter-spacing: 2px; } 
            .choice-btn { font-size: 0.85em; padding: 10px 15px; }
            #click-hint { font-size: 0.55em; bottom: 2.2vh; }
            
            .end-title { font-size: 2.8em; letter-spacing: 15px; margin-right: -15px; }
            .end-subtitle { font-size: 0.8em; letter-spacing: 6px; margin-right: -6px;}
            .replay-btn { padding: 10px 30px; font-size: 0.8em; margin-top: 50px; }
            .movie-credits { font-size: 0.4em; letter-spacing: 3px; bottom: 3vh; }
            @keyframes lineExpand { to { width: 120px; opacity: 1; } }
        }
    </style>
</head>
<body>

    <div class="film-grain"></div>
    <div class="ambient-glow"></div>

    <div class="letterbox-top"></div>
    <div class="letterbox-bottom"></div>

    <div class="bokeh b1"></div>
    <div class="bokeh b2"></div>
    <div class="bokeh b3"></div>

    <div id="start-screen">
        <div class="start-title">无声沉沦</div>
        <div class="start-subtitle">— 午夜影院 —</div>
        <div class="start-warning">※ 包含成人向感官互动，请戴上耳机，独自品味 ※</div>
        
        <div class="password-container">
            <input type="password" id="ticket-code" placeholder="输入专属检票码" autocomplete="off">
            <div id="error-msg" class="error-msg">检票码错误，请重新输入</div>
            <button class="start-btn" id="start-btn">[ 检票入场 ]</button>
        </div>
    </div>

    <div id="game-container">
        <div class="corner-anchor tl"></div>
        <div class="corner-anchor tr"></div>
        <div class="corner-anchor bl"></div>
        <div class="corner-anchor br"></div>
        
        <div class="top-ornament">
            <span>✦ 沉沦 ✦</span>
        </div>

        <div id="story-text"></div>
        <div id="prompt-box">
            <p id="prompt-text"></p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div id="click-hint">
        REC <div class="rec-dot"></div> PLAYING
    </div>

    <div id="end-screen">
        <div class="end-title">THE END</div>
        <div class="end-divider"></div>
        <div class="end-subtitle">你已彻底沦陷于她的掌心</div>
        <button class="replay-btn" id="replay-btn">重新放映</button>
        <div class="movie-credits">DIRECTED BY OBSESSION • A STORY OF MIDNIGHT CINEMA</div>
    </div>

    <script>
        const scriptData = [
            {
                story: "“晚上有空吗？我们去约会怎么样”卧室里只剩下加湿器吐出微弱的白雾，屏幕微弱的荧光映照着你因紧张而泛红的脸颊。她刻意压低的尾音带着一丝微不可察的沙哑，仿佛电流般顺着耳膜直达心底，让你握着手机的指尖都不自觉地微微出汗。平日里那个总是穿着得体套装、眼神淡漠的女人，此刻却用这种几乎算得上蛊惑的语气，向你发出深夜的邀约。",
                prompt: "缓慢深呼吸。将手轻覆在大腿根部，隔着衣物感受肌肤升温。",
                choices: [
                    { text: "乖乖答应", addon: "你红着脸小声答应，甚至能听到自己因过度兴奋而有些急促的呼吸声，指尖微颤着按下红色的挂断键，心跳早已彻底乱了节奏。挂断电话，" },
                    { text: "假装犹豫", addon: "你支吾着说要考虑，甚至故意拖长了语调试图掩饰内心的波澜，她却在电话那头低低地笑了一声：“别躲了，小骗子，我知道你有多想来。”那笃定的语气让你心头一颤，防线瞬间溃败。挂断电话，" }
                ]
            },
            {
                story: "[addon]那低哑的尾音如同最细软的羽毛，不厌其烦地反复撩拨着你脆弱的神经，小腹深处不由自主地腾起一丝异样的酥麻与热意。你走向衣柜，鬼使神差地挑了一件最显身段的轻薄真丝吊带裙，布料凉滑地贴着肌肤，而底下的内裤则紧紧贴着已然微微泛起湿润的私处。你小心翼翼地喷上她曾夸赞过的香水，让自己的装扮看起来清纯无害。",
                prompt: "想象她低哑的嗓音在耳边回荡，指尖缓缓移向私处，隔着布料轻压阴蒂，画着小圈。感受小腹下翻涌的空虚与期待。"

                prompt: "沉浸在余韵的羞耻与归属感中。轻压仍旧敏感肿胀的阴蒂，细细体味被她完全占有、彻底征服的隐秘欢愉。"
            },
            {

                prompt: "沾着体液的指尖轻压双唇，揉捏乳肉。想象唇舌抵死纠缠、氧气被尽数掠夺的窒息感。"

                prompt: "抚摸酸软的大腿内侧与一片狼藉的穴口，感受双腿脱力、连迈步都发颤的真实虚脱感。"
            },
            {
                story: "被她送回家后你的整个身子深深地陷在柔软得仿佛能吸附魂魄的厚重被褥中，脑海中走马灯般疯狂闪回着几个小时前，在那个黑暗闭塞的影厅情侣座里，自己是如何毫无尊严、满脸泪水地向她摇尾乞怜、放浪形骸地索要高潮的画面，每一个细节都历历在目，清晰得让人想要尖叫。就在这时，枕边的手机屏幕突然幽幽亮起，震动了一下。点开一看，是她发来的一条语音转文字的微信消息：“想姐姐了吗？别忘了刚才答应我的，以后的约会，里面……不许穿任何东西。晚安，宝宝。”仅仅是看着屏幕上这几行充满恶劣占有欲的文字，刚洗完澡的小腹深处竟再次不争气地涌起一股熟悉的湿热酸软感。你紧紧地将滚烫的手机抱在怀口贴近心脏的位置，嘴角控制不住地上扬，满怀着甜蜜闭上了双眼——你很清楚，从今往后，这具敏感的身体，将永远、且只为她一个人，无休止地泛滥泥泞。",
                prompt: "舒服地平躺，手指极尽温柔地揉弄阴蒂。脑海回放被狠狠贯穿的细节，带着彻底沦陷的满足与期待，沉入这场欲梦。"

        ];

        let currentIndex = 0;
        // typingState: -2=开始页, -1=结束页, 0=空闲待点击, 1=正在打字剧情, 2=正在打字提示, 3=等待选择
        let typingState = -2; 
        let typingTimeout;
        let currentAddon = ""; 

        const storyContainer = document.getElementById('story-text');
        const promptBox = document.getElementById('prompt-box');
        const promptText = document.getElementById('prompt-text');
        const choicesContainer = document.getElementById('choices-container');
        const clickHintStr = document.getElementById('click-hint');
        const gameContainer = document.getElementById('game-container');
        const endScreen = document.getElementById('end-screen');

        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        function typeWriter(element, text, index, speed, callback) {
            if (index < text.length) {
                element.innerHTML += text.charAt(index);
                index++;
                
                if(index % 30 === 0) {
                    scrollToBottom();
                }

                typingTimeout = setTimeout(() => typeWriter(element, text, index, speed, callback), speed); 
            } else {
                if (callback) callback();
            }
        }

        function loadScene() {
            if (currentIndex >= scriptData.length) return;

            const currentScene = scriptData[currentIndex];
            
            let processedStory = currentScene.story;
            if (currentAddon !== "") {
                processedStory = processedStory.replace("[addon]", currentAddon);
                currentAddon = ""; 
            } else {
                processedStory = processedStory.replace("[addon]", "");
            }
            
            storyContainer.innerHTML = '';
            promptBox.classList.remove('show'); 
            choicesContainer.classList.remove('show');
            promptText.innerHTML = '';
            choicesContainer.innerHTML = '';
            
            typingState = 1; 
            clickHintStr.style.opacity = 0.2; 
            
            window.scrollTo({ top: 0, behavior: 'auto' });

            typeWriter(storyContainer, processedStory, 0, 35, () => {
                if (typingState !== 1) return;
                
                promptBox.classList.add('show');
                typingState = 2; 
                
                typeWriter(promptText, currentScene.prompt, 0, 45, promptCallback);
            });
        }

        function promptCallback() {
            typingState = 0;
            const currentScene = scriptData[currentIndex];

            if (currentScene.choices && currentScene.choices.length > 0) {
                typingState = 3; 
                clickHintStr.style.opacity = 0; 

                let choicesHtml = '';
                currentScene.choices.forEach((choice, idx) => {
                    choicesHtml += `<button class="choice-btn" data-idx="${idx}">${choice.text}</button>`;
                });
                choicesContainer.innerHTML = choicesHtml;
                choicesContainer.classList.add('show');
                setTimeout(scrollToBottom, 100);

                document.querySelectorAll('.choice-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation(); 
                        let selectedChoice = currentScene.choices[this.getAttribute('data-idx')];
                        currentAddon = selectedChoice.addon; 
                        
                        choicesContainer.classList.remove('show');
                        
                        setTimeout(() => {
                            currentIndex++;
                            loadScene();
                        }, 400);
                    });
                });
            } else {
                clickHintStr.style.opacity = 1; 
                setTimeout(scrollToBottom, 100);
            }
        }

        function showEndScreen() {
            typingState = -1; 
            clickHintStr.style.opacity = 0; 
            
            gameContainer.style.opacity = 0;
            gameContainer.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                endScreen.classList.add('show');
            }, 1500);
        }

        // 开始页按钮与密码验证逻辑
        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.stopPropagation(); 
            const codeInput = document.getElementById('ticket-code');
            const errorMsg = document.getElementById('error-msg');
            
            if (codeInput.value === 'maru1631') {
                // 密码正确
                errorMsg.classList.remove('show');
                document.getElementById('start-screen').classList.add('hide');
                
                // 等待开始页淡出后，显示主容器并加载第一幕
                setTimeout(() => {
                    gameContainer.style.opacity = 1;
                    gameContainer.style.transform = 'scale(1)';
                    loadScene();
                }, 1500);
            } else {
                // 密码错误
                errorMsg.classList.add('show');
                codeInput.value = ''; // 清空输入框
                codeInput.focus();
            }
        });

        // 支持回车键提交密码
        document.getElementById('ticket-code').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('start-btn').click();
            }
        });

        // 重新放映按钮逻辑
        document.getElementById('replay-btn').addEventListener('click', (e) => {
            e.stopPropagation(); 
            
            endScreen.classList.remove('show');
            
            setTimeout(() => {
                currentIndex = 0;
                currentAddon = "";
                gameContainer.style.opacity = 1;
                gameContainer.style.transform = 'scale(1)';
                loadScene();
            }, 1000);
        });

        // 全局点击推进剧情逻辑
        document.body.addEventListener('click', () => {
            // 如果在开始页(-2)、谢幕页(-1)或等待选项(3)时，屏蔽全局点击
            if (typingState === -1 || typingState === -2 || typingState === 3) return; 

            const currentScene = scriptData[currentIndex];
            let processedStory = currentScene.story.replace("[addon]", currentAddon);

            if (typingState === 1) {
                clearTimeout(typingTimeout);
                storyContainer.innerHTML = processedStory;
                promptBox.classList.add('show');
                
                typingState = 2; 
                typeWriter(promptText, currentScene.prompt, 0, 45, promptCallback);

            } else if (typingState === 2) {
                clearTimeout(typingTimeout);
                promptText.innerHTML = currentScene.prompt;
                promptCallback();

            } else if (typingState === 0) {
                if (currentIndex < scriptData.length - 1) {
                    currentIndex++;
                    loadScene();
                } else if (currentIndex === scriptData.length - 1) {
                    showEndScreen(); 
                }
            }
        });

    </script>
