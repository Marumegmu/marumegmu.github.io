<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课后辅导</title>
    <style>     
        /* 基础页面 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0eee9;
            background-image: radial-gradient(#dcd8cf 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2c2a28; 
            font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }

        /* 极简页面外框 */
        .page-border {
            position: fixed;
            top: 20px; bottom: 20px; left: 20px; right: 20px;
            border: 1px solid rgba(200, 194, 183, 0.4);
            pointer-events: none; 
            z-index: 0;
        }

        /* 全屏边缘系统 UI */
        .top-screen-ui {
            position: fixed;
            top: 35px; 
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.6rem;
            color: rgba(156, 151, 144, 0.8);
            letter-spacing: 3px;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        
        .top-center-mark { font-size: 0.8rem; color: #c97a7e; }

        /* 顶部聚焦垂线 */
        .top-drop-line {
            position: fixed;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 1px; height: 10vh; 
            background: linear-gradient(to bottom, rgba(156, 151, 144, 0.4), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* 现代数字HUD装饰栏 */
        .modern-hud {
            position: fixed;
            top: 75px; left: 50%; transform: translateX(-50%); 
            width: 88%; max-width: 620px;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(184, 177, 166, 0.5);
            font-family: 'Courier New', Courier, monospace; 
            z-index: 10;
        }

        .hud-recording {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.65rem; color: #9c9790; letter-spacing: 1px;
        }
        .hud-dot {
            width: 6px; height: 6px; background-color: #c97a7e; 
            border-radius: 50%; transition: background-color 0.8s ease;
        }
        .anim-blink { animation: hud-blink 1.5s infinite; }
        .anim-fast-blink { animation: hud-blink 0.3s infinite; background-color: #ff3333; } 

        .hud-env {
            display: flex; align-items: center; gap: 12px;
            font-size: 0.65rem; color: #9c9790; letter-spacing: 1px;
        }
        .hud-barcode { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
        .hud-barcode span { width: 2px; background-color: rgba(156, 151, 144, 0.6); }
        .hud-barcode span:nth-child(1) { height: 6px; }
        .hud-barcode span:nth-child(2) { height: 10px; }
        .hud-barcode span:nth-child(3) { height: 4px; }
        .hud-barcode span:nth-child(4) { height: 12px; }
        .hud-barcode span:nth-child(5) { height: 8px; }

        /* 开始页样式 (包含密码输入) */
        #start-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f0eee9; z-index: 20; transition: opacity 1s ease;
        }
        .start-tag { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #c97a7e; letter-spacing: 4px; margin-bottom: 25px; transition: color 0.5s ease; }
        .start-title { font-family: "Noto Serif SC", serif; font-size: 1.8rem; font-weight: 400; letter-spacing: 12px; margin: 0 0 0 12px; color: #3d3935; }
        .start-line { width: 40px; height: 1px; background-color: rgba(156, 151, 144, 0.4); margin: 25px 0; }
        .start-subtitle { font-family: -apple-system, sans-serif; font-size: 0.7rem; letter-spacing: 6px; color: #9c9790; text-transform: uppercase; margin-bottom: 40px; }
        
        .pwd-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
        
        #password-input {
            padding: 12px 20px; font-family: 'Courier New', monospace; font-size: 0.9rem;
            background: transparent; border: 1px solid rgba(156, 151, 144, 0.4); color: #3d3935;
            text-align: center; outline: none; transition: all 0.3s ease; letter-spacing: 4px;
            width: 220px; border-radius: 2px;
        }
        #password-input:focus { border-color: #c97a7e; background-color: rgba(255,255,255,0.3); }
        #password-input::placeholder { color: rgba(156, 151, 144, 0.4); letter-spacing: 3px; font-size: 0.8rem; }
        #password-input.error { border-color: #ff3333; color: #ff3333; background-color: rgba(255, 51, 51, 0.05); }
        
        #password-error {
            color: #ff3333; font-family: 'Courier New', monospace; font-size: 0.7rem; margin-top: 12px;
            letter-spacing: 3px; opacity: 0; transition: opacity 0.3s ease; height: 12px; position: absolute; top: 100%;
        }

        #start-btn {
            margin-top: 45px; font-family: 'Courier New', monospace; font-size: 0.7rem; color: #8a837b;
            border: 1px solid rgba(156, 151, 144, 0.3); padding: 12px 24px; letter-spacing: 3px; cursor: pointer;
            transition: all 0.4s ease; text-transform: uppercase; border-radius: 2px; background: transparent;
        }
        #start-btn:hover { background-color: rgba(201, 122, 126, 0.08); color: #c97a7e; border-color: rgba(201, 122, 126, 0.4); }

        /* 游戏主体大容器 */
        #game-container {
            width: 88%; max-width: 620px;
            display: none; /* 初始隐藏 */
            flex-direction: column; gap: 15px; 
            z-index: 2; margin-top: 2vh; position: relative;
            opacity: 0; transition: opacity 1s ease;
        }

        #main-content {
            display: flex; flex-direction: column; gap: 15px;
            transition: opacity 1s ease;
        }

        /* 剧情卡片 */
        #story-card {
            position: relative;
            background-color: #ffffff;
            border: 1px solid #e3dfd8;
            border-radius: 4px; 
            padding: 40px 45px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.02); 
            min-height: 160px;
            overflow: hidden; 
        }

        /* 现代UI取景框十字准星 */
        .crosshair {
            position: absolute; font-family: monospace;
            color: rgba(201, 122, 126, 0.6); font-size: 14px;
            line-height: 1; pointer-events: none; font-weight: bold;
        }
        .cross-tl { top: 12px; left: 15px; } .cross-tr { top: 12px; right: 15px; }
        .cross-bl { bottom: 12px; left: 15px; } .cross-br { bottom: 12px; right: 15px; }

        /* 几何辅助线 */
        .geometry-deco-circle-1 {
            position: absolute; top: -40px; right: -30px;
            width: 140px; height: 140px;
            border: 1px solid rgba(201, 122, 126, 0.15); border-radius: 50%; pointer-events: none;
        }
        .geometry-deco-circle-2 {
            position: absolute; top: 20px; right: 50px;
            width: 80px; height: 80px;
            border: 1px dashed rgba(201, 122, 126, 0.2); border-radius: 50%; pointer-events: none;
        }
        .geometry-deco-line {
            position: absolute; top: 40px; right: -20px;
            width: 180px; height: 1px; background-color: rgba(201, 122, 126, 0.15);
            transform: rotate(-35deg); pointer-events: none;
        }

        /* 剧情文本 */
        #story-wrapper {
            position: relative; z-index: 1; 
            font-size: 0.95rem; line-height: 1.7; letter-spacing: 1px; 
            text-align: left; 
        }

        /* 模拟打字机光标 */
        .typing-cursor {
            display: inline-block; width: 2px; height: 1.05em;
            background-color: #c97a7e; vertical-align: text-bottom; margin-left: 2px;
            animation: type-blink 1s step-end infinite;
        }
        .typing-cursor.hidden { display: none; }

        /* 分支选项容器 */
        #options-container {
            display: none; 
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 0.8s ease;
            position: relative;
            z-index: 5;
        }

        /* 分支选项按钮 */
        .option-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(156, 151, 144, 0.4);
            border-radius: 4px;
            padding: 12px 18px;
            font-family: "Noto Serif SC", serif;
            font-size: 0.9rem;
            color: #3d3935;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .option-btn:hover {
            border-color: rgba(201, 122, 126, 0.6);
            background-color: rgba(201, 122, 126, 0.05);
            color: #c97a7e;
        }
        .option-tag {
            font-family: 'Courier New', monospace;
            font-size: 0.7em;
            color: rgba(201, 122, 126, 0.8);
            margin-right: 12px;
            font-weight: bold;
        }

        /* 引导区域 */
        #prompt-container {
            display: flex; flex-direction: column; gap: 6px;
            padding-left: 15px; margin-top: 5px;
            border-left: 2px solid rgba(201, 122, 126, 0.4); 
            opacity: 0; transition: opacity 0.8s ease;
        }
        .prompt-label { font-family: -apple-system, sans-serif; font-size: 0.6rem; letter-spacing: 2px; color: #c97a7e; font-weight: 600; }
        #prompt-text { font-family: -apple-system, sans-serif; font-size: 0.8rem; color: #7a756f; line-height: 1.5; margin: 0; letter-spacing: 0.5px; }

        /* 底部点击提示 */
        #click-hint {
            position: fixed; bottom: 25px;
            font-size: 0.65rem; letter-spacing: 4px; color: #a8a29a;
            font-family: -apple-system, sans-serif; text-transform: uppercase;
            animation: pulse-opacity 2.5s infinite ease-in-out; z-index: 2; transition: opacity 0.5s ease;
            opacity: 0; /* 初始隐藏 */
        }

        /* 结束页样式 */
        #end-screen {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 60px 0; opacity: 0; transition: opacity 1.5s ease;
        }
        .end-tag { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #c97a7e; letter-spacing: 4px; margin-bottom: 25px; }
        .end-title { font-family: "Noto Serif SC", serif; font-size: 1.4rem; font-weight: 400; letter-spacing: 6px; margin: 0 0 0 6px; color: #3d3935; }
        .end-line { width: 40px; height: 1px; background-color: rgba(156, 151, 144, 0.4); margin: 25px 0; }
        .end-subtitle { font-family: -apple-system, sans-serif; font-size: 0.7rem; letter-spacing: 6px; color: #9c9790; text-transform: uppercase; }
        #restart-btn {
            margin-top: 60px; font-family: 'Courier New', monospace; font-size: 0.7rem; color: #8a837b;
            border: 1px solid rgba(156, 151, 144, 0.3); padding: 12px 24px; letter-spacing: 3px; cursor: pointer;
            transition: all 0.4s ease; text-transform: uppercase; border-radius: 2px; background: transparent;
        }
        #restart-btn:hover { background-color: rgba(201, 122, 126, 0.08); color: #c97a7e; border-color: rgba(201, 122, 126, 0.4); }

        /* ================= 移动端终极适配 ================= */
        @media (max-width: 600px) {
            .page-border { top: 10px; bottom: 10px; left: 10px; right: 10px; }
            .top-screen-ui { top: 15px; left: 15px; right: 15px; font-size: 0.55rem; letter-spacing: 0px; }
            .top-drop-line { height: 4vh; }
            
            .modern-hud { top: 35px; width: 92%; padding-bottom: 8px;}
            .hud-recording, .hud-env { font-size: 0.55rem; letter-spacing: 0px; }

            .start-title { font-size: 1.4rem; letter-spacing: 8px; margin-left: 8px; }
            #password-input { width: 180px; font-size: 0.8rem; padding: 10px 15px; }
            #password-error { font-size: 0.6rem; }
            
            #game-container { width: 92%; margin-top: 4vh; gap: 12px; }
            #story-card { padding: 30px 20px; min-height: 120px; }
            
            #story-wrapper { font-size: 0.95rem; line-height: 1.65; letter-spacing: 0.8px; }
            #prompt-text { font-size: 0.82rem; line-height: 1.5; letter-spacing: 0px; }
            .prompt-label { font-size: 0.65rem; }
            
            .option-btn { font-size: 0.9rem; padding: 12px 15px; }
            .option-tag { font-size: 0.7em; margin-right: 8px; }
            
            #click-hint { bottom: 15px; font-size: 0.65rem; }
            
            .end-title { font-size: 1.2rem; letter-spacing: 4px; margin-left: 4px; }
            #end-screen { padding: 40px 0; }
        }

        /* 动画 */
        @keyframes hud-blink { 0%, 100% { opacity: 1; box-shadow: 0 0 5px rgba(201, 122, 126, 0.6); } 50% { opacity: 0.3; box-shadow: none; } }
        @keyframes type-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes pulse-opacity { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
        
        /* 震动动画 */
        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            20%, 60% { transform: translateX(-6px); } 
            40%, 80% { transform: translateX(6px); } 
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

    <div class="page-border"></div>
    
    <div class="top-screen-ui">
        <span>[ SYS.ARCHIVE ]</span>
        <span class="top-center-mark">＋</span>

    </div>

    <div class="top-drop-line"></div>

    <div class="modern-hud">
        <div class="hud-recording">
            <div class="hud-dot" id="hud-indicator" style="background-color: #9c9790;"></div>
            <span id="hud-status-text">MEMORY_LOG // LOCKED</span>

        <div class="hud-env">
            <div class="hud-barcode">
                <span></span><span></span><span></span><span></span><span></span>

            <span>28°C / 65% RH</span>
        </div>
    </div>

    <div id="start-screen">
        <div class="start-tag" id="auth-tag">[ SYSTEM // LOCKED ]</div>
        <h1 class="start-title">课 后 辅 导</h1>
        <div class="start-line"></div>
        <p class="start-subtitle">PRIVATE ARCHIVE // SENSORY LOG</p>
        
        <div class="pwd-wrapper">

        </div>
        
        <button id="start-btn">INITIALIZE</button>
    </div>

    <div id="game-container">

            <div id="story-card">

            <p class="end-subtitle" id="end-subtitle">SEE YOU TOMORROW</p>
            <button id="restart-btn">REBOOT_SYSTEM</button>

    </div>

    <div id="click-hint">点击屏幕继续</div>

    <script>
        const scriptData = [
            /* 0 */
            { 
                story: "周六下午三点，你准时按响了他家的门铃。午后的阳光慵懒地透过落地窗洒在木地板上。你穿着素雅的白衬衫，及膝的窄裙勾勒出修长的腿部线条，长发盘成知性的发髻。身为他的数学家教，今天这栋宽敞的房子里，只剩下你们两人。门开的瞬间，你敏锐地捕捉到了他眼底闪过的一抹亮色，那视线如同带着温度，轻轻掠过你的身姿。“老师，你来了。”他声音低沉，带着微哑。你走进书房，莫名觉得今天的空气有些稀薄。他在你身旁落座，当你弯腰指着错题时，衬衫顺着重力自然垂落，露出一截白皙柔美的颈际线。你听见他原本平稳的呼吸骤然乱了节奏，灼热的目光让你不由自主地并拢了双腿。你轻咳一声试图掩盖慌乱，声音却染上了一丝连自己都没察觉的娇柔。空气中那种名为“越界”的张力，已悄然蔓延。", 
                prompt: "闭上双眼，调整呼吸。指尖隔着衣料，从锁骨缓慢向下滑行，在最柔软的边缘停住，微微施压。任由第一丝微弱的战栗在心底蔓延。" 
            },
            /* 1 */
            { 
                story: "书房内只能听见笔尖沙沙的摩擦声，可他的体温却毫无阻碍地穿透衣料传递过来，扰得你心神微颤。你强迫自己盯着函数图，却无法忽略他始终游移在你领口与裙摆间的视线。你有些局促地想要挪开一点，他却像受到磁场牵引般自然地贴近，大腿侧边隔着薄薄的布料与你紧紧相依。你尽量维持着平稳的语调讲题，胸腔里的心跳却早已如擂鼓。当你再次俯身演算时，胸前起伏的弧线更加鲜明，你清晰地听见了他喉结滚动的吞咽声。“老师……这里我还是不太懂。”他凑到你耳边低语，温热的吐息拂过你的耳廓。你浑身一僵，少年身上干净的皂香与渐渐升腾的荷尔蒙气息将你密不透风地包裹。你不断在心里默念着“我是老师”，身体却已在悄悄软化。", 
                prompt: "将手缓缓滑至腿间，隔着布料轻压最敏感的所在。用指腹缓慢而有规律地滑动，感受体温逐渐升高。配合着逐渐加快的心跳，让指尖的力度微微加重。" 
            },
            /* 2 */
            { 
                story: "那份异样感越来越浓烈，你咬着唇，略显慌乱地清了清嗓子试图拉回他的注意力。可当你不经意间再次前倾身体时，衬衫的前襟微微敞开，一抹雪白无暇的肌肤毫无防备地暴露在他的视野里。他原本翻着书页的手猛地顿住，连呼吸都有一瞬间的停滞。你直起身，心跳彻底乱了阵脚。他没有说话，也没有避开视线，而是那样直白、灼热、充满渴望地凝视着你。那眼神如同燃烧的暗火，几乎要将你理智的防线烧穿。你强撑着拿起笔，指尖却控制不住地微微发颤。就在这时，他的膝盖在桌下看似无意地抵上了你的腿侧。", 
                prompt: "理智与本能在脑海中激烈撕扯。呼吸已经彻底乱了节奏，面对逐步逼近的压迫感，此时此刻，必须做出一个决定。",
                choices: [
                    { text: "站起身去倒水，试图逃离这令人窒息的氛围", next: 3 },
                    { text: "咬紧下唇，装作若无其事继续讲完最后一道题", next: 4 }
                ]
            },
            /* 3 (Branch A - Water) */
            {
                story: "你逃也似的站起身，借口口渴快步跑向客厅倒水。冰凉的水流过喉咙，却浇不灭体内悄然升起的燥热。就在你双手撑着流理台平复呼吸时，他不知何时跟了过来，温热的胸膛从背后直接贴上了你的背脊。他的双手撑在台面边缘，将你彻底困在他的怀抱与大理石之间。“老师，你在躲我吗？”他低头，灼热的呼吸尽数喷洒在你的耳廓，声音里带着不加掩饰的侵略性。",
                prompt: "指尖的力道变得更加清晰、不容抗拒。双手交替揉捏、按压，感受肌肤表面泛起的战栗。在被彻底包围的安全感中，放任身体泛起本能的潮湿。",
                next: 5
            },

                story: "黑暗中，他微微支起上身，目光灼灼地盯着你潮红未褪的脸庞。在这场充斥着汗水与疯狂的沉沦里，那些所谓的界限早已被彻底粉碎。令人心惊的是，你没有感到丝毫逃避的念头，反而不可抑制地生出了食髓知味的贪恋。你抬起酸软的手臂，指尖流连在他汗湿的背脊上，眼波流转间尽是连自己都未曾察觉的渴求。他精准地捕捉到了你眼底的情意，嘴角勾起一抹满足的轻笑。他低下头，鼻尖亲昵地蹭过你的侧脸，随后缓缓凑近你的耳郭。温热的呼吸带着微痒的触感拂过，他用那沙哑却极具蛊惑力的嗓音，在你耳边轻轻落下了一句话——", 
                prompt: "彻底放松已经虚脱的身体，指尖若有似无地掠过发颤的敏感点。将思绪彻底放空，带着这份极致的战栗与满足，渐渐沉入这场永远醒不过来的梦境。",
                isEnd: true,
                endTag: "[ SYSTEM // STANDBY ]",
                endTitle: "老师，明天也要记得来哦",
                endSubtitle: "SEE YOU TOMORROW"
            }
        ];

        let currentIndex = 0;
        let isTyping = false;
        let isEndScreen = false;
        let isWaitingForChoice = false;
        let typingTimeout;
        let isStarted = false;
        let isAuthenticated = false;
        
        const UNIFORM_TYPING_SPEED = 40;

        const mainContent = document.getElementById('main-content');
        const endScreen = document.getElementById('end-screen');
        const clickHint = document.getElementById('click-hint');
        const storyTextElement = document.getElementById('story-text');
        const cursorElement = document.getElementById('cursor');
        const promptContainer = document.getElementById('prompt-container');
        const promptTextElement = document.getElementById('prompt-text');
        const promptLabel = document.getElementById('prompt-label');
        const optionsContainer = document.getElementById('options-container');
        const timerContainer = document.getElementById('timer-bar-container');
        
        const hudIndicator = document.getElementById('hud-indicator');
        const hudStatusText = document.getElementById('hud-status-text');
        const restartBtn = document.getElementById('restart-btn');
        
        const passwordScreen = document.getElementById('password-screen');
        const passwordInput = document.getElementById('password-input');
        const passwordError = document.getElementById('password-error');
        const authBtn = document.getElementById('start-btn'); // 统一使用这个按钮
        const authTag = document.getElementById('auth-tag');

        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');

        // 密码验证并直接开始游戏
        authBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (passwordInput.value === 'maru2036') {
                passwordError.style.opacity = 0;
                passwordInput.classList.remove('error');
                
                authTag.innerText = '[ SYSTEM // AUTHENTICATED ]';
                authTag.style.color = '#8a837b';
                
                // 将 HUD 切换为激活状态
                hudIndicator.classList.add('anim-blink');
                hudIndicator.style.backgroundColor = '#c97a7e';
                hudStatusText.innerText = 'MEMORY_LOG // ACTIVE';

                startScreen.style.opacity = 0;
                
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    isAuthenticated = true;
                    isStarted = true;
                    
                    // 显示游戏主体容器并启动剧情
                    gameContainer.style.display = 'flex';
                    void gameContainer.offsetWidth; // 触发重绘
                    gameContainer.style.opacity = 1;
                    
                    loadScene();
                }, 1000);
            } else {
                passwordError.style.opacity = 1;
                passwordInput.classList.add('error');
                passwordInput.classList.add('shake-anim');
                passwordInput.value = '';
                
                setTimeout(() => {
                    passwordInput.classList.remove('shake-anim');
                }, 400);
            }
        });

        // 用户重新输入时隐藏错误
        passwordInput.addEventListener('input', () => {
            passwordError.style.opacity = 0;
            passwordInput.classList.remove('error');
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                authBtn.click();
            }
        });

        // 阻止点击事件冒泡到 body，防止误触推进剧情
        startScreen.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        function updateUI() {}

        function typeWriter(text, index, element, speed, callback) {
            if (index === 0) {
                element.innerHTML = '';
            }

            if (index < text.length) {
                let char = text.charAt(index);
                element.innerHTML += char;
                index++;
                
                typingTimeout = setTimeout(() => typeWriter(text, index, element, speed, callback), speed);
            } else {
                if (callback) callback();
            }
        }

        function handleChoice(nextIndex) {
            optionsContainer.style.opacity = 0;
            
            hudIndicator.classList.remove('anim-fast-blink');
            hudIndicator.classList.add('anim-blink');
            promptLabel.style.color = '#c97a7e';
            promptContainer.style.borderLeftColor = 'rgba(201, 122, 126, 0.4)';

            setTimeout(() => {
                optionsContainer.style.display = 'none';
                currentIndex = nextIndex;
                isWaitingForChoice = false;
                loadScene();
            }, 500);
        }

        function displayChoices(scene) {
            isWaitingForChoice = true;
            clickHint.style.opacity = 0; 

            if (scene.isWarning) {
                hudIndicator.classList.remove('anim-blink');
                hudIndicator.classList.add('anim-fast-blink');
                promptLabel.style.color = '#ff3333';
                promptContainer.style.borderLeftColor = 'rgba(255, 51, 51, 0.6)';
            }

            optionsContainer.innerHTML = '';
            scene.choices.forEach((choice, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-tag">[ ACTION // 0${idx+1} ]</span>${choice.text}`;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    handleChoice(choice.next);
                };
                optionsContainer.appendChild(btn);
            });

            optionsContainer.style.display = 'flex';
            setTimeout(() => optionsContainer.style.opacity = 1, 50);
        }

        function loadScene() {
            if (currentIndex >= scriptData.length) return;

            const currentScene = scriptData[currentIndex];
            
            storyTextElement.innerHTML = '';
            promptTextElement.innerHTML = '';
            promptContainer.style.opacity = 0;
            cursorElement.classList.remove('hidden'); 
            isTyping = true;
            clickHint.style.opacity = 1; 
            
            updateUI();

            typeWriter(currentScene.story, 0, storyTextElement, UNIFORM_TYPING_SPEED, () => {
                promptContainer.style.opacity = 1;
                
                typingTimeout = setTimeout(() => {
                    typeWriter(currentScene.prompt, 0, promptTextElement, UNIFORM_TYPING_SPEED, () => {
                        isTyping = false; 
                        cursorElement.classList.add('hidden'); 
                        
                        if (currentScene.choices) {
                            displayChoices(currentScene);
                        }
                    });
                }, 250);
            });
        }

        function showEndScreen(scene) {
            isEndScreen = true;
            
            hudIndicator.classList.remove('anim-blink');
            hudIndicator.classList.remove('anim-fast-blink');
            hudIndicator.style.backgroundColor = '#9c9790';
            hudStatusText.innerText = 'MEMORY_LOG // OFFLINE';

            clickHint.style.opacity = 0;
            mainContent.style.opacity = 0;

            document.getElementById('end-tag').innerText = scene.endTag;
            document.getElementById('end-title').innerText = scene.endTitle;
            document.getElementById('end-subtitle').innerText = scene.endSubtitle;

            setTimeout(() => {
                mainContent.style.display = 'none';
                endScreen.style.display = 'flex';
                setTimeout(() => { endScreen.style.opacity = 1; }, 50);
            }, 1000); 
        }

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            endScreen.style.opacity = 0;

            setTimeout(() => {
                endScreen.style.display = 'none';
                currentIndex = 0;
                isEndScreen = false;
                mainContent.style.display = 'flex';
                
                hudIndicator.classList.add('anim-blink');
                hudIndicator.style.backgroundColor = '#c97a7e';
                hudStatusText.innerText = 'MEMORY_LOG // ACTIVE';
                promptLabel.style.color = '#c97a7e';
                promptContainer.style.borderLeftColor = 'rgba(201, 122, 126, 0.4)';

                setTimeout(() => {
                    mainContent.style.opacity = 1;
                    loadScene();
                }, 50);
            }, 1000);
        });

        document.body.addEventListener('click', () => {
            if (!isAuthenticated || !isStarted || isEndScreen || isWaitingForChoice) return; 

            if (isTyping) {
                clearTimeout(typingTimeout);
                const currentScene = scriptData[currentIndex];
                storyTextElement.innerHTML = currentScene.story;
                promptTextElement.innerHTML = currentScene.prompt;
                promptContainer.style.opacity = 1;
                cursorElement.classList.add('hidden'); 
                isTyping = false;

                if (currentScene.choices) {
                    displayChoices(currentScene);
                }
            } else {
                const currentScene = scriptData[currentIndex];
                if (currentScene.isEnd) {
                    showEndScreen(currentScene);
                } else {
                    currentIndex = currentScene.next !== undefined ? currentScene.next : currentIndex + 1;
                    loadScene();
                }
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                startScreen.style.display = 'flex';
                setTimeout(() => { startScreen.style.opacity = 1; }, 50);
            });
        } else {
            startScreen.style.display = 'flex';
            setTimeout(() => { startScreen.style.opacity = 1; }, 50);
        }
    </script>
</body>
</html>
