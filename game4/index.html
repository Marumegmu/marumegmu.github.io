<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>永恒的执念</title>
<style>
        /* ================= 核心流光色彩体系 ================= */
        :root {
            --text-story: #e8e0e3;
            --text-prompt: #f0a8b9;
            --text-muted: rgba(200, 180, 190, 0.5);
            --accent-blood: #c41230;
            --accent-purple: #5c1b54;
            --font-serif: "Noto Serif SC", "Songti SC", "SimSun", "STKaiti", serif;
        }

        /* 动态呼吸流光背景 & 移动端锁死视口防回弹 */
        html {
            background-color: #000; /* 兜底纯黑背景，防止部分浏览器透明化 */
            width: 100%; height: 100%;
        }
        
        body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            position: fixed; /* 彻底解决手机端 100vh 被地址栏遮挡的问题 */
            top: 0; left: 0;
            
            /* 恢复原版流光背景 */
            background-color: #000;
            background-image: linear-gradient(120deg, #090204 0%, #17050e 25%, #05060d 50%, #120206 75%, #050207 100%);
            background-size: 400% 400%;
            animation: liveShadows 25s ease infinite alternate;
            
            color: var(--text-story); font-family: var(--font-serif);
            overflow: hidden; /* 防止橡皮筋拉伸回弹 */
            overscroll-behavior: none; 
            touch-action: none; /* 禁用全局默认手势，内部滚动区单独开放 */
            -webkit-touch-callout: none; /* 禁用长按菜单 */
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        @keyframes liveShadows {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 全局环境装饰（粒子） ================= */
        .bg-mandala {
            position: absolute; width: 200vw; height: 200vh;
            max-width: 1200px; max-height: 1200px; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent, transparent 40px, rgba(196, 18, 48, 0.03) 41px, transparent 42px);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: rotateMandala 120s linear infinite; z-index: 0; pointer-events: none;
        }
        @keyframes rotateMandala { 
            from { transform: translate(-50%, -50%) rotate(0deg); } 
            to { transform: translate(-50%, -50%) rotate(360deg); } 
        }

        /* 悬浮粒子特效 */
        .particles {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: radial-gradient(circle, rgba(196,18,48,0.2) 1px, transparent 1px),
            radial-gradient(circle, rgba(240,168,185,0.1) 2px, transparent 2px);
            background-size: 80px 80px, 150px 150px;
            animation: particleDrift 80s linear infinite;
        }
        @keyframes particleDrift { 100% { background-position: 400px -400px, -300px -500px; } }

        /* 哥特式全局外框 */
        .global-frame {
            position: absolute; inset: clamp(8px, 2.5vw, 15px);
            border: 1px solid rgba(196, 18, 48, 0.1); pointer-events: none; z-index: 100;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.9);
        }
        .global-frame::before, .global-frame::after {
            content: ''; position: absolute; inset: 4px;
            border: 1px dashed rgba(240, 168, 185, 0.08);
        }
        /* 角落流光节点 */
        .g-node { position: absolute; width: 6px; height: 6px; background: #000; border: 1px solid var(--accent-blood); box-shadow: 0 0 10px var(--accent-blood); border-radius: 50%; }
        .gn-tl { top: -3px; left: -3px; } .gn-tr { top: -3px; right: -3px; }
        .gn-bl { bottom: -3px; left: -3px; } .gn-br { bottom: -3px; right: -3px; }

        /* ================= 屏幕切换 ================= */
        .screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s; z-index: 10;
        }
        .screen.active { opacity: 1; visibility: visible; z-index: 20; }

        /* ================= 开始页 & 密码区 ================= */
        #start-screen { background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.9) 100%); }
        .title-container { z-index: 2; text-align: center; position: relative; width: 100%; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .title-cn {
            font-size: clamp(2rem, 8vw, 4.5rem); 
            letter-spacing: clamp(6px, 3vw, 18px); 
            text-indent: clamp(6px, 3vw, 18px);
            white-space: nowrap; 
            font-weight: 300; margin-bottom: 15px; color: #fff; pointer-events: none;
            text-shadow: 0 0 15px rgba(196,18,48,0.8), 2px 2px 25px var(--accent-purple), 0 0 40px rgba(255,255,255,0.3);
            animation: ghostlyTitle 4s ease-in-out infinite alternate;
        }
        @keyframes ghostlyTitle { 0% { transform: scale(0.98); filter: brightness(0.8) blur(0.5px); } 100% { transform: scale(1.02); filter: brightness(1.2) blur(0); } }
        
        .title-divider {
            color: var(--text-prompt);
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            letter-spacing: clamp(4px, 2vw, 10px);
            margin-bottom: 40px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.7; white-space: nowrap; 
            text-shadow: 0 0 8px var(--accent-blood);
        }
        .title-divider::before, .title-divider::after {
            content: ''; width: clamp(20px, 8vw, 50px); height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blood), transparent);
            margin: 0 10px;
        }

        .password-box {
            background: radial-gradient(circle at top, rgba(40, 10, 20, 0.3) 0%, rgba(10, 2, 5, 0.1) 100%);
            border-top: 1px solid rgba(196, 18, 48, 0.3);
            border-bottom: 1px solid rgba(196, 18, 48, 0.3);
            padding: 30px 20px; display: flex; flex-direction: column; align-items: center;
            gap: 18px; pointer-events: auto; position: relative; width: 100%; max-width: 320px;
        }
        .password-box::before { content: '✦'; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); color: var(--accent-blood); font-size: 10px; }
        .password-box::after { content: '✦'; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); color: var(--accent-blood); font-size: 10px; }

        #secret-key {
            background: rgba(10, 2, 5, 0.6); border: 1px solid rgba(196, 18, 48, 0.4);
            border-radius: 2px; color: var(--text-prompt); padding: 12px 20px;
            font-size: 0.95rem; text-align: center; outline: none; font-family: var(--font-serif);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8); transition: all 0.4s ease;
            letter-spacing: 3px; width: 100%; box-sizing: border-box;
        }
        #secret-key::placeholder { color: rgba(240, 168, 185, 0.3); letter-spacing: 2px; font-size: 0.85rem; }
        #secret-key:focus { border-color: var(--accent-blood); box-shadow: 0 0 20px rgba(196, 18, 48, 0.5), inset 0 0 10px rgba(196, 18, 48, 0.2); background: rgba(30, 5, 12, 0.8); }
        
        #unlock-btn {
            background: transparent; border: 1px solid rgba(196, 18, 48, 0.5);
            color: var(--text-prompt); padding: 12px 40px; font-size: 0.9rem;
            cursor: pointer; font-family: var(--font-serif); letter-spacing: 8px; text-indent: 8px;
            transition: all 0.4s ease; position: relative; overflow: hidden; border-radius: 2px; white-space: nowrap;
        }
        #unlock-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(196, 18, 48, 0.3), transparent); transition: left 0.6s ease; }
        #unlock-btn:hover::before, #unlock-btn:active::before { left: 100%; }
        #unlock-btn:hover, #unlock-btn:active { border-color: #ff2a4b; color: #fff; box-shadow: 0 0 20px rgba(196, 18, 48, 0.6), inset 0 0 10px rgba(196, 18, 48, 0.2); text-shadow: 0 0 5px #fff; }
        
        #error-msg { color: #ff2a4b; font-size: 0.8rem; letter-spacing: 2px; height: 20px; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 10px rgba(196,18,48,0.8); margin-bottom: -10px; white-space: nowrap; }
        @keyframes pwdShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
        .shake-anim { animation: pwdShake 0.4s ease-in-out; }

        /* ================= 游戏本体 ================= */
        #game-screen { 
            padding: clamp(20px, 4vh, 40px) clamp(15px, 4vw, 30px); 
            box-sizing: border-box; 
        } 
        
        #game-container { 
            width: 100%; max-width: 650px; height: 100%; 
            display: flex; flex-direction: column; 
            position: relative; z-index: 2; padding-bottom: 15px; 
        }

        /* 剧情区：动态伸缩高度，完美适应手机 */
        #story-frame {
            position: relative; 
            flex: 1 1 0; /* 允许弹性压缩，确保底部选项不溢出屏幕 */
            min-height: 0; /* 关键：解决 Flex 溢出核心属性 */
            margin-bottom: 12px;
            background: radial-gradient(circle at top, rgba(40, 10, 20, 0.65) 0%, rgba(10, 2, 5, 0.85) 80%);
            border: 1px solid rgba(196, 18, 48, 0.15); border-radius: 2px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.95), inset 0 0 40px rgba(196, 18, 48, 0.08);
            display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* 顶部与底部血色仪式线 */
        .frame-ornament { position: absolute; left: 50%; transform: translateX(-50%); width: 80%; height: 12px; display: flex; align-items: center; justify-content: center; opacity: 0.7; z-index: 3; pointer-events: none; }
        .fo-top { top: 0; } .fo-bottom { bottom: 0; }
        .frame-ornament::before, .frame-ornament::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent-blood), transparent); }
        .frame-ornament .fo-star { color: var(--text-prompt); font-size: 10px; margin: 0 15px; text-shadow: 0 0 8px var(--accent-blood); animation: breath 3s infinite; }

        /* 复古华丽边角 */
        .sf-corner { position: absolute; width: 24px; height: 24px; pointer-events: none; z-index: 2; }
        .sf-corner::before { content: ''; position: absolute; width: 100%; height: 100%; border: 2px solid rgba(196, 18, 48, 0.5); }
        .sfc-tl { top: 6px; left: 6px; } .sfc-tl::before { border-right: none; border-bottom: none; }
        .sfc-tr { top: 6px; right: 6px; } .sfc-tr::before { border-left: none; border-bottom: none; }
        .sfc-bl { bottom: 6px; left: 6px; } .sfc-bl::before { border-right: none; border-top: none; }
        .sfc-br { bottom: 6px; right: 6px; } .sfc-br::before { border-left: none; border-top: none; }
        .sf-corner::after { content: '✦'; position: absolute; font-size: 10px; color: var(--text-prompt); opacity: 0.4; }
        .sfc-tl::after { top: 2px; left: 2px; } .sfc-tr::after { top: 2px; right: 2px; }
        .sfc-bl::after { bottom: 2px; left: 2px; } .sfc-br::after { bottom: 2px; right: 2px; }

        /* 内部滚动区解开触控限制 */
        #story-scroll-area {
            flex: 1; overflow-y: auto; padding: 25px 20px; position: relative; z-index: 1;
            scrollbar-width: none; -ms-overflow-style: none; display: block; 
            touch-action: pan-y; /* 仅允许纵向原生滑动 */
            -webkit-overflow-scrolling: touch; /* 保证 iOS 丝滑滚动 */
        }
        #story-scroll-area::-webkit-scrollbar { display: none; }
        
        #story-text { 
            font-size: clamp(0.9rem, 4vw, 1.05rem); 
            line-height: 1.7; letter-spacing: 1.5px; 
            color: var(--text-story); text-align: justify; 
            white-space: pre-wrap; padding-bottom: 5px; margin: 0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9); 
        }

        /* 引导框：仪式感强化 */
        #prompt-box {
            flex-shrink: 0; background: linear-gradient(135deg, rgba(20, 5, 10, 0.9), rgba(40, 8, 15, 0.85), rgba(20, 5, 10, 0.9));
            border: 1px solid rgba(196, 18, 48, 0.2); 
            border-top: 2px solid var(--accent-blood); border-bottom: 2px solid #5a0a18;
            padding: 12px 15px; border-radius: 2px; opacity: 0; transform: translateY(10px); transition: opacity 1.5s ease, transform 1.5s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85), inset 0 0 25px rgba(196, 18, 48, 0.1); position: relative;
        }
        .prompt-label { font-size: 0.75rem; color: #fff; letter-spacing: 4px; margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 10px var(--accent-blood), 0 0 20px var(--accent-purple); }
        .prompt-label::before, .prompt-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(240, 168, 185, 0.4), transparent); margin: 0 12px; }
        #prompt-text { color: #d6bpc4; font-size: clamp(0.85rem, 3.8vw, 0.95rem); line-height: 1.55; margin: 0; font-style: italic; letter-spacing: 0.8px; text-shadow: 0 1px 3px rgba(0,0,0,1); text-align: justify; }

        /* 分支选项框 */
        #choices-container {
            flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; 
            opacity: 0; visibility: hidden; transition: opacity 1s ease;
            position: relative; width: 100%; z-index: 10;
        }
        #choices-container.active { opacity: 1; visibility: visible; margin-top: 15px; }
        
        .choice-btn {
            background: linear-gradient(90deg, rgba(30, 5, 12, 0.9) 0%, rgba(15, 3, 6, 0.8) 100%);
            border: 1px solid rgba(196, 18, 48, 0.3); border-left: 4px solid var(--accent-blood);
            color: var(--text-prompt); padding: 12px 15px; font-family: var(--font-serif); font-size: clamp(0.9rem, 3.8vw, 1.05rem);
            cursor: pointer; text-align: left; border-radius: 2px; transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(196,18,48,0.05);
            letter-spacing: 1.2px; line-height: 1.4; position: relative; overflow: hidden;
            /* 解决移动端点击闪烁问题 */
            -webkit-tap-highlight-color: transparent; outline: none;
        }
        
        .choice-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(240, 168, 185, 0.1), transparent);
            transform: skewX(-20deg); transition: left 0.5s ease;
        }
        .choice-btn:hover::before, .choice-btn:active::before { left: 150%; }
        .choice-btn:hover, .choice-btn:active {
            background: linear-gradient(90deg, rgba(50, 8, 18, 0.95) 0%, rgba(20, 4, 8, 0.85) 100%);
            border-color: #ff2a4b; color: #fff; border-left-width: 6px;
            box-shadow: 0 0 25px rgba(196, 18, 48, 0.6), inset 0 0 20px rgba(196, 18, 48, 0.2);
            transform: scale(0.99); text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        #click-hint { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            text-align: center; font-size: 0.75rem; color: rgba(200, 180, 190, 0.4); 
            letter-spacing: 6px; opacity: 0; transition: opacity 1s; 
            text-transform: uppercase; white-space: nowrap; pointer-events: none;
        }

        /* ================= 结局页 ================= */
        #ending-screen { background: radial-gradient(circle at center, rgba(35, 5, 12, 0.9) 0%, #030001 100%); }
        .end-content { z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px; width: 100%; box-sizing: border-box; }
        .end-cn { font-size: clamp(1.5rem, 6vw, 3rem); color: #ff2a4b; white-space: nowrap; letter-spacing: clamp(4px, 3vw, 15px); text-indent: clamp(4px, 3vw, 15px); margin-bottom: 20px; opacity: 0; font-weight: 300; text-shadow: 0 0 20px rgba(255,42,75,0.5), 0 0 40px var(--accent-purple); }
        .end-divider { width: 1px; height: 50px; background: linear-gradient(to bottom, transparent, rgba(255, 42, 75, 0.8), transparent); margin: 0 auto 20px auto; opacity: 0; box-shadow: 0 0 10px #ff2a4b; }
        .end-sub { font-size: clamp(0.9rem, 4vw, 1.1rem); color: #d6bpc4; white-space: nowrap; letter-spacing: clamp(4px, 2vw, 18px); text-indent: clamp(4px, 2vw, 18px); margin-bottom: 60px; opacity: 0; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
        
        #restart-btn { 
            padding: 12px 35px; font-size: 0.9rem; background: transparent; border: 1px solid rgba(196, 18, 48, 0.4); 
            color: rgba(232, 224, 227, 0.7); border-radius: 2px; cursor: pointer; letter-spacing: 8px; text-indent: 8px; 
            opacity: 0; font-family: var(--font-serif); transition: all 0.4s ease; position: relative; overflow: hidden; white-space: nowrap; 
        }
        #restart-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(196, 18, 48, 0.3), transparent); transition: left 0.6s ease; }
        #restart-btn:hover::before, #restart-btn:active::before { left: 100%; }
        #restart-btn:hover, #restart-btn:active { border-color: #ff2a4b; color: #fff; box-shadow: 0 0 25px rgba(196, 18, 48, 0.7), inset 0 0 15px rgba(196, 18, 48, 0.4); text-shadow: 0 0 5px #fff; }

        /* ================= 动画 ================= */
        @keyframes breath { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; filter: brightness(1.2); } }
        @keyframes revealBleed { 0% { opacity: 0; transform: scale(0.95); filter: blur(8px); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
    </style>
</head>
<body>

    <div class="bg-mandala"></div>
    <div class="particles"></div>
    
    <div class="global-frame">
        <div class="g-node gn-tl"></div><div class="g-node gn-tr"></div>
        <div class="g-node gn-bl"></div><div class="g-node gn-br"></div>
    </div>

    <div id="start-screen" class="screen active">
        <div class="title-container">
            <div class="title-cn">永恒的执念</div>
            <div class="title-divider">✦ 要爱我，像以前那样 ✦</div>
            <div class="password-box" id="pwd-box">
                <input type="password" id="secret-key" placeholder="输入契约密钥..." autocomplete="off">
                <button id="unlock-btn" onclick="checkPassword(event)" ontouchstart="checkPassword(event)">解除封印</button>
                <div id="error-msg"></div>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="game-container">
            
            <div id="story-frame">
                <div class="sf-corner sfc-tl"></div><div class="sf-corner sfc-tr"></div>
                <div class="sf-corner sfc-bl"></div><div class="sf-corner sfc-br"></div>
                
                <div class="frame-ornament fo-top"><div class="fo-star">✦</div></div>
                
                <div id="story-scroll-area">
                    <div id="story-text"></div>
                </div>

                <div class="frame-ornament fo-bottom"><div class="fo-star">✦</div></div>
            </div>

            <div id="prompt-box">
                <div class="prompt-label"></div>
                <p id="prompt-text"></p>
            </div>
            
            <div id="choices-container"></div>
            <div id="click-hint">—— 沉沦下一刻 ——</div>
        </div>
    </div>

    <div id="ending-screen" class="screen">
        <div class="end-content">
            <div class="end-cn" id="end-cn">我们要永远在一起</div>
            <div class="end-divider" id="end-divider"></div>
            <div class="end-sub" id="end-sub">我爱你，一直都是</div>
            <button id="restart-btn" onclick="restartGame(event)" ontouchstart="restartGame(event)">重回梦魇</button>
        </div>
    </div>

    <script>
        const scriptData = {
            "s0": {
                story: "十年前，在搬家卡车的轰鸣声中，你亲手将那个破旧的布偶塞进了黑色垃圾袋。你以为那只是一次微不足道的断舍离。然而多年后，废弃旧屋的阴暗角落里，陈年的怨念与不知名的古老契约交织，让他跨越漫长的光阴找到了你。\n\n今夜，当你拖着疲惫不堪的身躯瘫在客厅沙发上时，空气中的温度骤然降至冰点。一双散发着阴冷寒意的手，毫无预兆地从背后死死捂住了你的眼睛。“我找了你整整十年……我的小主人。”低哑而空灵的男声在耳畔轰然炸开，带着令人毛骨悚然的眷恋。\n\n你惊恐地想要挣扎，却被一股不讲道理的庞大力量牢牢禁锢在沙发上。紧接着，一股让人苏麻的炽热感顺着他的掌心，强行侵入你的意识。你感到私处逐渐泥泞不堪，全身的血液都在叫嚣着渴望他更为深入的触碰。你死死咬住苍白的嘴唇，拼命将那声即将脱口而出的甜腻喘息咽回肚子里，身体却控制不住地颤抖起来。",
                prompt: "轻轻分开双腿，指尖微曲，用中指和食指的指腹在阴蒂上方最敏感的区域，极其轻柔、缓慢地画圈。渐渐加快指尖画圈的速度，先不要插入，只在外侧不断地滑动挑逗。",
                next: "s1"

            "s1": {

                story: "压抑了一整天的欲火在此刻彻底引爆。你不仅没有闪躲，反而双手颤抖着扯开了自己剩余的纽扣，任由昂贵的真丝衬衫滑落脚边。你将他推倒在玄关的墙上，胡乱地亲吻着他冰冷的下颌。\n\n“别废话了……快给我……我想要……”你红着眼睛，隔着布料用泥泞不堪的私处磨蹭着他早已挺立的部位。只剩下对交媾的渴求。\n\n他眼底闪过一丝意外，随即化作浓浓的兴奋。他一把掐住你乱动的腰：“小主人真是饿坏了，不过，我需要再确定最后一件事。”",
                prompt: "双手揉捏自己的乳肉，指尖刮擦乳尖。下身用大腿根部互相摩擦，手指快速在阴蒂上打圈，低声喘息着说出索求的下流话语。",
                next: "s13"
            },
            "c3b": {
                story: "最后一丝作为人类的羞耻心也荡然无存。你顺着门板软软地滑跪在地，双膝分开，像一只真正发情的母犬一般，将上半身伏低，高高撅起那泥泞不堪的臀部。声音甜腻、毫无底线地哀求着：\n\n“求你肏我……随便怎么弄坏我都可以……”\n\n你心甘情愿地将自己降格取悦他。他垂眸温柔地看着你，宽大冰冷的手掌抚上你的发顶：“真乖。既然这么想当我的小狗，那就得给你套上该有的项圈，让你明白自己到底该做什么。”",
                prompt: "腰部塌下。将一根手指极浅地含在嘴里模拟讨好的舔舐，另一只手两根手指插入穴内进行缓慢但深入的抽送。变成一只只知道交配的宠物。",
                next: "s13"
            },
            "s13": {
                story: "他不知从哪里找来了一条柔韧的红丝带，将你的双手手腕死死绑在了床头栏杆上，双腿则被粗暴地大开，用领带固定在两侧的床柱上，彻底暴露出你已经滴水的小穴。你平时用来解决生理反应的震动棒被涂满了润滑液，毫不留情地推入到底，并直接开启了最高频率。\n\n“叫出声来，小主人。让我听听，你现在到底有多想要我。”\n\n经过今天在危险公共场合的极限拉扯，你认清了自己内心的真面目。曾经那个高傲、试图反抗的你已经死在了深渊里。面对他的逼迫，你不再想咬唇强忍，而是饥渴地挺起腰肢迎合着那根冰冷的玩具，扬起脖颈，任由甜腻淫荡的呻吟声脱口而出。满脑子只有如何让他更加粗暴地占有你的淫荡念头。",
                prompt: "双腿尽最大幅度大开，毫无保留地暴露自己。用两根手指插入快速抽插，拇指在外侧不停刺激阴蒂。深刻感受那种被束缚却甘之如饴的堕落感。顺从地发出娇喘声，持续刺激。",
                next: "s14"
            },
            "s14": {
                story: "听到你终于不再有丝毫刻意压抑，那甜腻的娇喘声回荡在卧室内，他漆黑的眼底瞬间闪过一丝满足与狂热。他一把抽出那根还在嗡嗡作响的玩具随意扔在地毯上，换上自己那根早已胀痛难忍、粗长滚烫的实体，没有任何前戏和缓冲，对准那张翕张流水的缝隙，直接插到宫口。\n\n“这就对了，小主人，你看你还是这么爱我这副身体。”\n\n被绑缚的身体被逼到高潮边缘。你扭动着腰肢，拼命收缩甬道去夹紧他，不知疲倦地迎合着他的撞击。失禁般的潮吹一次次发生，透明的体液如同喷泉般洒向半空，将整个床单彻底毁掉。你流着眼泪，毫无顾忌地大声浪叫着祈求他再深一点。在这张凌乱的床上享受着极致的堕落。",
                prompt: "将手指增加到三根，每一次都插到最深处。另一只手快速地拨弄揉按阴蒂。放开腰部的限制，主动向上迎合。加快节奏，直到逼出大脑失控的潮吹。大声浪叫出声。",
                next: "s15"
            },
            "s15": {
                story: "此时的他完全褪去了那一层温柔的伪装，不知疲倦地挺腰抽插。那根粗长上翘的实体以极其凶狠的力道一下下重重凿击着你最脆弱的子宫口。你胸前饱满的乳肉随着撞击晃动，粉嫩的乳尖被他毫不留情地又咬又吸，留下触目惊心的深红色印记。\n\n“小主人，想高潮的话该说什么？”他为你顺着额前的碎发，停住了动作轻声问。\n\n被快感吊在半空的感觉并不好受。你哭喊着大声回答：“我...我爱你，我最爱你了，我不会再把你丢下了！”他听到答案后满意的继续整根抽插。最终的高潮被他强行锁死在顶点，那种大脑空白、灵魂战栗的感觉被生生延长了数分钟之久，你爽得眼眸失去焦距，意识几乎消失。",
                prompt: "用三根手指深插到极点，每一次都要去勾深处最酸胀的部位。同时，另一只手用力捏揉、揪扯乳尖。加快抽送直到高潮也不可以停，抽出手指揉搓阴蒂让快感延长。",
                next: "s16"
            },
            "s16": {
                story: "这场漫长、激烈到几乎要将你彻底拆散重组的调教终于告一段落，绑缚在手腕上的红丝带被他轻柔地解开。你像一个破布娃娃一样，浑身抽搐着瘫软在凌乱不堪的床铺上。白皙的手腕上留下了两道刺眼的红痕。他将你小心翼翼地抱进怀里。像小时候你抱着那个破旧布偶安抚它一样，带着令人毛骨悚然的病态痴迷，伸出舌尖一点点舔舐着你手腕上的勒痕。\n\n“对不起……可是……我真的好怕，怕你像一开始那样抗拒我，怕你有一天清醒过来，又要像二十年前那个下午那样，无情地把我扔进垃圾桶里丢下我……”\n\n他将脸埋在你的颈窝，声音里透着令人心碎的脆弱与极度的偏执。那如同被抛弃的幼兽般的眼神，彻底将你内心深处某种病态的母性与扭曲的爱意点燃。你看着眼前这张漂亮的脸，缓缓伸出颤抖的双手，主动、紧紧地环住了他的脖颈，轻轻的，在他的唇上印下一个吻。",
                prompt: "就算高潮也不可以停手，但可以将动作慢下来，扣弄G点或是在阴蒂上蹭。",
                next: "s20"
            },
            "s20": {
                story: "夜阑人静，你在浴室里胡乱冲洗了一番后，拖着几乎散架的身体躺在被窝里。眼皮重得像灌了铅，刚准备陷入沉睡，他便从身后贴上来，用宽大的胸膛紧紧拥住你单薄的后背。\n\n那根明明刚洗干净、甚至才宣泄过不久的实体，竟然不知何时又恢复了精神抖擞的状态，顶端流出的清液混合着残存的水汽，顺着你大腿根部的曲线，轻车熟路地滑进了那个依旧温暖湿润、甚至一直在隐隐抽动的缝隙里。“安心睡吧。”他在你耳畔落下轻柔的吻。\n\n如果是之前，你一定会惊恐地挣扎逃离。但现在，你早已在这一遍遍的做爱中彻底堕落。你甚至连眼睛都没睁开，只是凭借着本能，主动向后挺翘起臀部，贪婪地将他吃得更深。你的嘴里无意识地呢喃着几句听不清的娇嗔，双手拉过他的手臂环住自己的腰，安然地享受着这份只属于你们两个的亲密。",
                prompt: "从后方的角度插入手指。无需剧烈运动，只需主动、缓慢的扭动腰肢，向后方迎合。",
                next: "s21"
            },
            "s21": {
                story: "在你处于那种半梦半醒、意识混沌的边缘状态时，他开始动了。他克制地控制着每一次抽插的深度与速度。时而只是在入口处极浅极慢地研磨，用顶端不断挑逗着那圈敏感的褶皱；时而又突然发力，整根没入，重重碾过那个只要一碰就会让你发抖的凸起敏感点。\n\n你的呼吸依旧保持着均匀绵长，眼睫毛微垂，整个人沉浸在甜美的梦乡里。你那具早已被彻底改造的身体，却极其淫荡地弓起了一道弧度，胸前那两颗红豆硬挺地戳着睡衣的布料，下身不断溢出的汁液将他的大腿都弄得一片泥泞。\n\n梦境中光怪陆离的碎片与现实里下半身不断传来的真实快感交织在一起，让你的意识彻底模糊。你分不清自己究竟是在梦里被他无情地侵犯，还是在现实中贪得无厌地榨取他。这种亦真亦幻的刺激，让你在完全无意识的状态下，身体不断地痉挛，一次又一次地走向潮吹，在睡梦中度过了一个荒诞的漫漫长夜。",
                prompt: "抽出手指在阴蒂尖上打圈轻蹭，直到揉出水再撑开穴口拨弄阴蒂，直到再次高潮。",
                next: "s23"
            },
            "s23": {
                story: "“你知道吗？你五岁的时候，每天晚上都要紧紧抱着我，把脸埋在我的绒毛里才能安稳入睡……现在，那些绒毛变成了我的这具身体，以后，每天晚上都要换我从里面，死死地抱着你，填满你。”\n\n他痴迷地用带着一丝沙哑的声音抱着你说着你有多可爱。而你在这种温馨的时刻却被他操到颤抖流水。你不再有任何抗拒的念头。双手在黑暗中胡乱地摸索着，直到反扣住他那宽大冰凉的手掌，十根手指用力地穿插交叠在一起，紧紧相握。你太害怕失去了，避之不及的恶魔，现在却成了你想依赖的人，你只想就这样和他无休止地交媾纠缠，直到世界末日。",
                prompt: "擦干净残留的水渍，整理好汗湿的头发，让全身沉溺在高潮后的余韵中。",
                next: null
            }
        };

        let currentId = "s0";
        let typingTimeout;
        let promptDelayTimeout;
        let lockClick = false; 
        let currentPhase = 'IDLE';
        let gameStarted = false;

        const storyContainer = document.getElementById('story-text');
        const scrollArea = document.getElementById('story-scroll-area');
        const promptBox = document.getElementById('prompt-box');
        const promptText = document.getElementById('prompt-text');
        const clickHint = document.getElementById('click-hint');
        const choicesContainer = document.getElementById('choices-container');

        // ================= 密码验证逻辑 =================
        function checkPassword(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const inputVal = document.getElementById('secret-key').value;
            const errorMsg = document.getElementById('error-msg');
            const pwdBox = document.getElementById('pwd-box');

            if (inputVal === 'maru1847') {
                errorMsg.style.opacity = '0';
                document.getElementById('secret-key').blur(); // 隐藏键盘
                startGame();
            } else {
                errorMsg.textContent = '契约密钥错误，封印无法解除';
                errorMsg.style.opacity = '1';
                
                pwdBox.classList.remove('shake-anim');
                void pwdBox.offsetWidth; 
                pwdBox.classList.add('shake-anim');
            }
        }

        document.getElementById('secret-key').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkPassword();
            }
        });

        // ================= 流程控制 =================
        function switchScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            for (let i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active');
            }
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            
            switchScreen('game-screen');
            setTimeout(() => {
                currentId = "s0";
                loadScene();
            }, 1000); 
        }

        function typeWriter(text, index, targetElement, speed, callback) {
            if (!text) {
                if (callback) callback();
                return;
            }
            if (index <= text.length) {
                targetElement.textContent = text.substring(0, index);
                index++;
                if (targetElement === storyContainer) scrollArea.scrollTop = scrollArea.scrollHeight;
                typingTimeout = setTimeout(() => typeWriter(text, index, targetElement, speed, callback), speed); 
            } else {
                if (callback) callback();
            }
        }

        function loadScene() {
            if (!scriptData[currentId]) return;
            
            lockClick = true; 
            setTimeout(() => { lockClick = false; }, 300); 

            const currentScene = scriptData[currentId];
            
            storyContainer.textContent = '';
            
            promptBox.style.opacity = '0';
            promptBox.style.transform = 'translateY(10px)';
            promptText.textContent = '';
            choicesContainer.classList.remove('active');
            choicesContainer.innerHTML = '';
            clickHint.style.opacity = '0';
            
            if (currentScene.choices) {
                promptBox.style.display = 'none'; 
                
                for (let i = 0; i < currentScene.choices.length; i++) {
                    const choice = currentScene.choices[i];
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    
                    // 支持触摸与点击，防止点击穿透
                    const tapHandler = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        makeChoice(choice.next);
                    };
                    btn.addEventListener('click', tapHandler);
                    btn.addEventListener('touchend', tapHandler);
                    
                    choicesContainer.appendChild(btn);
                }
            } else {
                promptBox.style.display = 'block'; 
            }
            
            currentPhase = 'STORY_TYPING';

            typeWriter(currentScene.story, 0, storyContainer, 25, () => {
                if (currentPhase === 'STORY_TYPING') {
                    if (currentScene.choices) {
                        showChoices();
                    } else {
                        startPromptPhase();
                    }
                }
            });
        }

        function showChoices() {
            currentPhase = 'WAITING_FOR_CHOICE';
            choicesContainer.classList.add('active');
            clickHint.style.opacity = '0'; 
            
            // 等待 DOM 渲染后滚动到底部
            setTimeout(() => {
                scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 50);
        }

        function makeChoice(nextId) {
            if (lockClick) return;
            lockClick = true;
            
            choicesContainer.classList.remove('active');
            currentId = nextId;
            setTimeout(() => { loadScene(); }, 400);
        }

        function startPromptPhase() {
            currentPhase = 'PROMPT_TYPING';
            const currentScene = scriptData[currentId];
            
            promptBox.style.opacity = '1';
            promptBox.style.transform = 'translateY(0)';
            
            promptDelayTimeout = setTimeout(() => {
                if (currentPhase !== 'PROMPT_TYPING') return;
                typeWriter(currentScene.prompt, 0, promptText, 35, () => {
                    if (currentPhase === 'PROMPT_TYPING') finishPhase();
                });
            }, 400); 
        }

        function finishPhase() {
            currentPhase = 'DONE';
            setTimeout(() => { clickHint.style.opacity = '1'; }, 200);
        }

        function scrambleReveal(element, finalText, delay) {
            const chars = '✦✧幻虚无灭死生魂念怨恨痴贪沉沦＠＃＄％＆＊＋？';
            setTimeout(() => {
                element.style.opacity = '1';
                let frame = 0; let length = finalText.length;
                let interval = setInterval(() => {
                    let finished = 0; let displayString = '';
                    for (let i = 0; i < length; i++) {
                        if (finalText[i] === ' ' || finalText[i] === '·' || finalText[i] === '，') { displayString += finalText[i]; finished++; continue; }
                        let threshold = i * 4; 
                        if (frame >= threshold + 10) { displayString += finalText[i]; finished++; } 
                        else { displayString += chars[Math.floor(Math.random() * chars.length)]; }
                    }
                    element.textContent = displayString; frame++;
                    if (finished >= length) { clearInterval(interval); element.textContent = finalText; }
                }, 50);
            }, delay);
        }

        function showEndingScreen() {
            switchScreen('ending-screen');
            const cnText = document.getElementById('end-cn');
            const divider = document.getElementById('end-divider');
            const subText = document.getElementById('end-sub');
            const btn = document.getElementById('restart-btn');

            cnText.textContent = ''; subText.textContent = '';
            scrambleReveal(cnText, '我们要永远在一起', 800);
            setTimeout(() => { divider.style.animation = 'revealBleed 2s ease forwards'; }, 2500);
            scrambleReveal(subText, '我爱你，一直都是', 3800);
            setTimeout(() => { btn.style.animation = 'revealBleed 2s ease forwards'; }, 6500);
        }

        function restartGame(event) {
            if(event) { event.preventDefault(); event.stopPropagation(); }
            location.reload(); 
        }

        function handleGlobalClick(event) {
            if (lockClick) return; 
            if (currentPhase === 'WAITING_FOR_CHOICE') return; 

            // 过滤掉对于内部滚动条的点击误触
            if (event.target.closest('#choices-container')) return;

            if (currentPhase === 'STORY_TYPING') {
                clearTimeout(typingTimeout);
                const currentScene = scriptData[currentId];
                storyContainer.textContent = currentScene.story || "";
                scrollArea.scrollTop = scrollArea.scrollHeight;
                
                if (currentScene.choices) {
                    showChoices();
                } else {
                    startPromptPhase();
                }
                
                lockClick = true;
                setTimeout(() => { lockClick = false; }, 300);
                
            } else if (currentPhase === 'PROMPT_TYPING') {
                clearTimeout(typingTimeout);
                clearTimeout(promptDelayTimeout);
                
                promptBox.style.opacity = '1';
                promptBox.style.transform = 'translateY(0)';
                promptText.textContent = scriptData[currentId].prompt || "";
                
                finishPhase();
                lockClick = true;
                setTimeout(() => { lockClick = false; }, 300);
                
            } else if (currentPhase === 'DONE') {
                if (scriptData[currentId].next) {
                    currentId = scriptData[currentId].next;
                    loadScene();
                } else {
                    showEndingScreen();
                }
            }
        }

        // 绑定全局点击与触摸事件推进剧情
        const gameScreen = document.getElementById('game-screen');
        gameScreen.addEventListener('click', handleGlobalClick);
    </script>
</body>
</html>
