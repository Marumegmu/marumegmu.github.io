<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>永恒的执念</title>
    <style>
        /* ================= 核心流光色彩体系 ================= */
        :root {
            --text-story: #e8e0e3; 
            --text-prompt: #f0a8b9; 
            --text-muted: rgba(200, 180, 190, 0.5);
            --accent-blood: #c41230;
            --accent-purple: #5c1b54;
            --font-serif: "Noto Serif SC", "Songti SC", "SimSun", "STKaiti", serif;
        }

        /* 动态呼吸流光背景 */
        body {
            margin: 0; padding: 0;
            background: linear-gradient(120deg, #090204 0%, #17050e 25%, #05060d 50%, #120206 75%, #050207 100%);
            background-size: 400% 400%;
            animation: livingShadows 25s ease infinite alternate;
            color: var(--text-story); font-family: var(--font-serif);
            height: 100vh; width: 100vw; overflow: hidden;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }
        @keyframes livingShadows {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 全局环境装饰（粒子与暗角） ================= */
        .bg-mandala {
            position: absolute; width: 200vw; height: 200vw;
            max-width: 1200px; max-height: 1200px; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent, transparent 40px, rgba(196, 18, 48, 0.03) 41px, transparent 42px);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: rotateMandala 120s linear infinite; z-index: 0; pointer-events: none;
        }
        @keyframes rotateMandala { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* 悬浮粒子特效 */
        .particles {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: radial-gradient(circle, rgba(196,18,48,0.2) 1px, transparent 1px),
                              radial-gradient(circle, rgba(240,168,185,0.1) 2px, transparent 2px);
            background-size: 80px 80px, 150px 150px;
            animation: particleDrift 80s linear infinite;
        }
        @keyframes particleDrift { 100% { background-position: 400px -400px, -300px -500px; } }

        /* 屏幕四周暗角 */
        .vignette {
            position: absolute; inset: 0; pointer-events: none; z-index: 50;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%);
        }

        /* 哥特式全局外框 */
        .global-frame {
            position: fixed; inset: clamp(10px, 2.5vw, 15px);
            border: 1px solid rgba(196, 18, 48, 0.1); pointer-events: none; z-index: 100;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.9);
        }
        .global-frame::before, .global-frame::after {
            content: ''; position: absolute; inset: 4px;
            border: 1px dashed rgba(240, 168, 185, 0.08);
        }
        /* 角落流光节点 */
        .g-node { position: absolute; width: 6px; height: 6px; background: #000; border: 1px solid var(--accent-blood); box-shadow: 0 0 10px var(--accent-blood); border-radius: 50%; }
        .gn-tl { top: -3px; left: -3px; } .gn-tr { top: -3px; right: -3px; }
        .gn-bl { bottom: -3px; left: -3px; } .gn-br { bottom: -3px; right: -3px; }

        /* ================= 屏幕切换 ================= */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s; z-index: 10;
        }
        .screen.active { opacity: 1; visibility: visible; z-index: 20; }

        /* ================= 开始页 ================= */
        #start-screen { cursor: pointer; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.9) 100%); }
        .title-container { z-index: 2; text-align: center; pointer-events: none; position: relative; }
        .title-cn {
            font-size: clamp(2.8rem, 12vw, 4.5rem); letter-spacing: 18px; text-indent: 18px;
            font-weight: 300; margin-bottom: 40px; color: #fff;
            text-shadow: 0 0 15px rgba(196,18,48,0.8), 2px 2px 25px var(--accent-purple), 0 0 40px rgba(255,255,255,0.3);
            animation: ghostlyTitle 4s ease-in-out infinite alternate;
        }
        @keyframes ghostlyTitle { 0% { transform: scale(0.98); filter: brightness(0.8) blur(0.5px); } 100% { transform: scale(1.02); filter: brightness(1.2) blur(0); } }
        .start-hint { 
            font-size: 0.95rem; color: var(--text-prompt); letter-spacing: 10px; animation: breath 2.5s infinite ease-in-out; 
            border-top: 1px solid rgba(196, 18, 48, 0.5); border-bottom: 1px solid rgba(196, 18, 48, 0.5); padding: 10px 0; 
            position: relative; display: inline-block;
        }
        .start-hint::before, .start-hint::after { content: '✧'; position: absolute; top: 50%; transform: translateY(-50%); color: var(--accent-blood); font-size: 0.8rem; }
        .start-hint::before { left: -25px; } .start-hint::after { right: -25px; }

        /* ================= 游戏本体 ================= */
        #game-screen { padding: clamp(2vh, 3vh, 20px) clamp(4vw, 5vw, 20px); box-sizing: border-box; justify-content: center; } 
        
        #game-container { 
            width: 100%; max-width: 650px; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; 
            position: relative; z-index: 2; padding-bottom: 25px; 
        }

        /* 剧情区：增加了华丽的上下装饰线 */
        #story-frame {
            position: relative; flex: 0 1 auto; max-height: 80vh; margin-bottom: 12px;
            background: radial-gradient(circle at top, rgba(40, 10, 20, 0.65) 0%, rgba(10, 2, 5, 0.85) 80%);
            border: 1px solid rgba(196, 18, 48, 0.15); border-radius: 2px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.95), inset 0 0 40px rgba(196, 18, 48, 0.08);
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* 顶部与底部血色仪式线 */
        .frame-ornament {
            position: absolute; left: 50%; transform: translateX(-50%); width: 80%; height: 12px;
            display: flex; align-items: center; justify-content: center; opacity: 0.7; z-index: 3; pointer-events: none;
        }
        .fo-top { top: 0; } .fo-bottom { bottom: 0; }
        .frame-ornament::before, .frame-ornament::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--accent-blood), transparent); }
        .frame-ornament .fo-star { color: var(--text-prompt); font-size: 10px; margin: 0 15px; text-shadow: 0 0 8px var(--accent-blood); animation: breath 3s infinite; }

        /* 复古华丽边角 */
        .sf-corner { position: absolute; width: 24px; height: 24px; pointer-events: none; z-index: 2; }
        .sf-corner::before { content: ''; position: absolute; width: 100%; height: 100%; border: 2px solid rgba(196, 18, 48, 0.5); }
        .sfc-tl { top: 6px; left: 6px; } .sfc-tl::before { border-right: none; border-bottom: none; }
        .sfc-tr { top: 6px; right: 6px; } .sfc-tr::before { border-left: none; border-bottom: none; }
        .sfc-bl { bottom: 6px; left: 6px; } .sfc-bl::before { border-right: none; border-top: none; }
        .sfc-br { bottom: 6px; right: 6px; } .sfc-br::before { border-left: none; border-top: none; }
        .sf-corner::after { content: '✦'; position: absolute; font-size: 10px; color: var(--text-prompt); opacity: 0.4; }
        .sfc-tl::after { top: 2px; left: 2px; } .sfc-tr::after { top: 2px; right: 2px; }
        .sfc-bl::after { bottom: 2px; left: 2px; } .sfc-br::after { bottom: 2px; right: 2px; }

        #story-scroll-area {
            overflow-y: auto; padding: 28px 22px; position: relative; z-index: 1;
            scrollbar-width: none; -ms-overflow-style: none; display: block; 
        }
        #story-scroll-area::-webkit-scrollbar { display: none; }
        
        #story-text { 
            font-size: clamp(0.95rem, 4.2vw, 1.1rem); 
            line-height: 1.55; letter-spacing: 1.5px; 
            color: var(--text-story); text-align: justify; 
            white-space: pre-wrap; padding-bottom: 5px; margin: 0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9); 
        }

        /* 引导框：仪式感强化 */
        #prompt-box {
            flex-shrink: 0; background: linear-gradient(135deg, rgba(20, 5, 10, 0.9), rgba(40, 8, 15, 0.85), rgba(20, 5, 10, 0.9));
            border: 1px solid rgba(196, 18, 48, 0.2); 
            border-top: 2px solid var(--accent-blood); border-bottom: 2px solid #5a0a18;
            padding: 15px 20px; border-radius: 2px; opacity: 0; transform: translateY(10px); transition: opacity 1.5s ease, transform 1.5s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85), inset 0 0 25px rgba(196, 18, 48, 0.1); position: relative; min-height: 60px;
        }
        .prompt-label { font-size: 0.8rem; color: #fff; letter-spacing: 4px; margin-bottom: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 10px var(--accent-blood), 0 0 20px var(--accent-purple); }
        .prompt-label::before, .prompt-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(240, 168, 185, 0.4), transparent); margin: 0 12px; }
        #prompt-text { color: #d6bpc4; font-size: clamp(0.85rem, 3.6vw, 0.95rem); line-height: 1.55; margin: 0; font-style: italic; letter-spacing: 0.8px; text-shadow: 0 1px 3px rgba(0,0,0,1); text-align: justify; }

        /* 分支选项框：增加流光与猩红前缀 */
        #choices-container {
            flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; 
            opacity: 0; visibility: hidden; transition: opacity 1s ease;
            position: relative; width: 100%; z-index: 10;
        }
        #choices-container.active { opacity: 1; visibility: visible; margin-top: 18px; }
        
        .choice-btn {
            background: linear-gradient(90deg, rgba(30, 5, 12, 0.9) 0%, rgba(15, 3, 6, 0.8) 100%);
            border: 1px solid rgba(196, 18, 48, 0.3);
            border-left: 4px solid var(--accent-blood);
            color: var(--text-prompt); padding: 15px 20px; font-family: var(--font-serif); font-size: clamp(0.9rem, 3.8vw, 1.05rem);
            cursor: pointer; text-align: left; border-radius: 2px; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(196,18,48,0.05);
            letter-spacing: 1.5px; line-height: 1.45; position: relative; overflow: hidden;
        }
        /* 按钮扫光特效 */
        .choice-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(240, 168, 185, 0.1), transparent);
            transform: skewX(-20deg); transition: left 0.6s ease;
        }
        .choice-btn:hover::before, .choice-btn:active::before { left: 150%; }
        
        .choice-btn:hover, .choice-btn:active {
            background: linear-gradient(90deg, rgba(50, 8, 18, 0.95) 0%, rgba(20, 4, 8, 0.85) 100%);
            border-color: #ff2a4b; color: #fff; border-left-width: 6px;
            box-shadow: 0 0 25px rgba(196, 18, 48, 0.6), inset 0 0 20px rgba(196, 18, 48, 0.2);
            transform: translateX(8px) scale(1.01); text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        #click-hint { 
            position: absolute; bottom: 0px; left: 0; width: 100%; 
            text-align: center; font-size: 0.75rem; color: rgba(200, 180, 190, 0.4); 
            letter-spacing: 8px; opacity: 0; transition: opacity 1s; 
            text-transform: uppercase;
        }

        /* ================= 结局页 ================= */
        #ending-screen { background: radial-gradient(circle at center, rgba(35, 5, 12, 0.9) 0%, #030001 100%); }
        .end-content { z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px; width: 100%; box-sizing: border-box; }
        .end-cn { font-size: clamp(1.5rem, 6.5vw, 3rem); color: #ff2a4b; white-space: nowrap; letter-spacing: clamp(6px, 3.5vw, 15px); text-indent: clamp(6px, 3.5vw, 15px); margin-bottom: 20px; opacity: 0; font-weight: 300; text-shadow: 0 0 20px rgba(255,42,75,0.5), 0 0 40px var(--accent-purple); }
        .end-divider { width: 1px; height: 50px; background: linear-gradient(to bottom, transparent, rgba(255, 42, 75, 0.8), transparent); margin: 0 auto 20px auto; opacity: 0; box-shadow: 0 0 10px #ff2a4b; }
        .end-sub { font-size: clamp(0.9rem, 4vw, 1.1rem); color: #d6bpc4; white-space: nowrap; letter-spacing: clamp(5px, 2.5vw, 18px); text-indent: clamp(5px, 2.5vw, 18px); margin-bottom: 60px; opacity: 0; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
        
        #restart-btn { 
            padding: 12px 45px; font-size: 0.9rem; background: transparent; border: 1px solid rgba(196, 18, 48, 0.4); 
            color: rgba(232, 224, 227, 0.7); border-radius: 2px; cursor: pointer; letter-spacing: 10px; text-indent: 10px; 
            opacity: 0; font-family: var(--font-serif); transition: all 0.5s ease; position: relative; overflow: hidden; white-space: nowrap; 
        }
        #restart-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(196, 18, 48, 0.3), transparent); transition: left 0.6s ease; }
        #restart-btn:hover::before { left: 100%; }
        #restart-btn:hover { border-color: #ff2a4b; color: #fff; box-shadow: 0 0 25px rgba(196, 18, 48, 0.7), inset 0 0 15px rgba(196, 18, 48, 0.4); text-shadow: 0 0 5px #fff; }

        /* ================= 动画 ================= */
        @keyframes breath { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; filter: brightness(1.2); } }
        @keyframes revealBleed { 0% { opacity: 0; transform: scale(0.95); filter: blur(8px); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
    </style>
</head>
<body>

    <!-- 背景特效群 -->
    <div class="bg-mandala"></div>
    <div class="particles"></div>
    <div class="bg-pattern"></div>
    <div class="vignette"></div>
    
    <!-- 全局复古外框 -->
    <div class="global-frame">
        <div class="g-node gn-tl"></div><div class="g-node gn-tr"></div>
        <div class="g-node gn-bl"></div><div class="g-node gn-br"></div>
    </div>

    <!-- 开始页 -->
    <div id="start-screen" class="screen active" onclick="startGame(event)" ontouchstart="startGame(event)">
        <div class="title-container">
            <div class="title-cn">永恒的执念</div>
            <div class="start-hint">进入梦境</div>
        </div>
    </div>

    <!-- 游戏本体 -->
    <div id="game-screen" class="screen">
        <div id="game-container">
            
            <div id="story-frame">
                <!-- 哥特边角装饰 -->
                <div class="sf-corner sfc-tl"></div><div class="sf-corner sfc-tr"></div>
                <div class="sf-corner sfc-bl"></div><div class="sf-corner sfc-br"></div>
                
                <!-- 上下仪式感线条 -->
                <div class="frame-ornament fo-top"><div class="fo-star">✦</div></div>
                
                <div id="story-scroll-area">
                    <div id="story-text"></div>
                </div>

                <div class="frame-ornament fo-bottom"><div class="fo-star">✦</div></div>
            </div>

            <div id="prompt-box">
                <div class="prompt-label"></div>
                <p id="prompt-text"></p>
            </div>
            
            <div id="choices-container"></div>
            <div id="click-hint">—— 沉沦下一刻 ——</div>
        </div>
    </div>

    <!-- 结局界面 -->
    <div id="ending-screen" class="screen">
        <div class="end-content">
            <div class="end-cn" id="end-cn">我们要永远在一起</div>
            <div class="end-divider" id="end-divider"></div>
            <div class="end-sub" id="end-sub">契约已成 · 灵魂相融</div>
            <button id="restart-btn" onclick="restartGame(event)" ontouchstart="restartGame(event)">重回梦魇</button>
        </div>
    </div>

    <script>
        const scriptData = {
            "s0": {
                story: "二十年前，在搬家卡车的轰鸣声中，你亲手将那个破旧的布偶塞进了黑色垃圾袋。你以为那只是一次微不足道的断舍离。然而多年后，废弃旧屋的阴暗角落里，陈年的怨念与不知名的古老契约交织，让他跨越漫长的光阴找到了你。\n\n今夜，当你拖着疲惫不堪的身躯瘫在客厅沙发上时，空气中的温度骤然降至冰点。一双散发着阴冷寒意的手，毫无预兆地从背后死死捂住了你的眼睛。“我找了你整整二十年……我的小主人。”低哑而空灵的男声在耳畔轰然炸开，带着令人毛骨悚然的眷恋。\n\n你惊恐地想要挣扎，却被一股不讲道理的庞大力量牢牢禁锢在怀中。紧接着，一股让人苏麻的炽热感顺着他的掌心，强行侵入你的意识。你感到私处逐渐泥泞不堪，全身的血液都在叫嚣着渴望他更为深入的触碰。你死死咬住苍白的嘴唇，拼命将那声即将脱口而出的甜腻喘息咽回肚子里，身体却控制不住地颤抖起来。",
                prompt: "轻轻分开双腿，指尖微曲，用中指和食指的指腹在阴蒂上方最敏感的区域，极其轻柔、缓慢地画圈。渐渐加快指尖画圈的速度，先不要插入，只在外侧不断地滑动挑逗。",
                next: "s1"
            },
            "s1": {
                story: "他绕到你身前，单膝跪在沙发边缘，膝盖陷进柔软的皮质靠垫里，发出微小摩擦声。修长的手指一点点撩起你紧绷的包臀职业裙，暴露出那条洇湿的内裤。客厅的窗帘还没拉严实，窗外老旧路灯的光斑影影绰绰地打在你们纠缠的身体上，甚至能清晰地看到远处偶尔经过的邻居的模糊剪影。\n\n“嘘，不要乱动。要是挣扎的幅度太大，万一被路过的邻居看到就不好了。”\n\n他微笑着贴近你的耳廓低语，如同吐信的毒蛇。随即将那层可怜的布料拨到一旁，微凉的舌尖舔上那颗充血挺立的阴蒂。快感的刺激让你猛地仰起头，喉咙里不受控制地溢出一丝破碎的泣音。你下意识地死死捂住自己的嘴，眼泪涌出眼眶。每当路灯的光扫过窗棂，你都不受控得发抖。那种随时都会彻底暴露在公众视野下的恐慌，将你整个人彻底淹没。",
                prompt: "用指腹揉着阴蒂缓缓打圈，当淫水渐渐溢出时，加快手指打圈的节奏。将一根手指极其浅地推入穴口，只在边缘轻轻抽插，来到小高潮的边缘就停住五秒不碰。",
                next: "s2"
            },
            "s2": {
                story: "他的指尖顺着湿滑的穴肉，毫无阻碍地滑入穴口的深处。\n\n“里面这么软，流了这么多水，是不是小主人也很想我...？”他低声呢喃着，两根长指毫不客气地插入穴口，准确无误地勾弄起最深处的G点，大拇指则同时碾磨阴蒂。\n\n这股直击灵魂的快感被放大了无数倍，你甚至感觉到了微弱的电流在脊椎上疯狂乱窜，大脑一片空白。你死死咬着唇瓣，强迫自己忍住喘叫的声音，生怕发出一丁点异响——因为门外走廊上似乎刚刚传来了邻居倒垃圾的沉重脚步声。如果这时候有人敲门，如果有人透过未关紧的防盗门缝隙往里看……可实际上，你的大腿内侧正因为过度的刺激颤个不停。每一次被他抽插都要绷直身体，才能压抑住想要抬高臀部去主动迎合的扭动作。",
                prompt: "将沾满淫水的两根手指指尖插入。微微弯曲指节，寻找前壁那块微微凸起的软肉，用力勾弄。不许喘出声音。",
                next: "s3"

            "s3": {

                prompt: "双腿用力夹紧，大腿根部紧绷。用尽全力去收缩阴道肌肉，如同要将进入的手指生生绞断一样去吸吮。在内心里大声、疯狂地承认自己离不开他，渴求更猛烈、更暴虐的对待。然而，表面上却必须强迫自己保持最安静、最均匀的呼吸起伏。手指在下身反而要加速进行疯狂的抽动，在极静与极动的撕裂感中，深深体会这种充满病态控制欲与偏执占有欲的、让人不可自拔上瘾的日常快感。",
                next: "s23"
            },
            "s23": {
                story: "“你知道吗？你五岁的时候，每天晚上都要紧紧抱着我，把脸埋在我的绒毛里才能安稳入睡……从今往后，那些绒毛变成了我的这具身体，以后，每天晚上都要换我从里面，死死地抱着你，填满你。”\n\n他低沉、痴迷、甚至带着一丝沙哑的声音，成了你每晚临睡前最有效、也最致命的催眠曲。伴随着那根实体在体内强有力的、不知疲倦的打桩般律动，你在这个深夜里彻底抛弃了所有的自尊。你不再有任何抗拒的念头，而是放声大哭。那混杂着潮吹的透明汁液，与因为极度快感而流下的生理性泪水混合在一起，将枕巾彻底浸透。你的双手在黑暗中胡乱地摸索着，直到死死反扣住他那宽大冰凉的手掌，十根手指用力地穿插交叠在一起，紧紧相握。你太害怕失去了，曾经避之不及的恶魔，现在却成了你全部的生命依靠，你只想就这样和他无休止地交媾纠缠，直到世界末日。",
                prompt: "双手紧紧环抱住自己的身体，指甲掐进肉里。下身用手指模拟出最稳定、最有力、打桩机般的律动抽插，彻底扭动腰肢，迎接那汹涌而至的潮吹。不要压抑情绪，让眼眶泛酸，让生理性的泪水夺眶而出，彻底释放所有的防备，接纳自己这副扭曲又深情的灵魂。沉沦在这绵长无绝期的高潮余韵之中，用另一只手的手指死死抓紧身下的被单，直到肌肉僵硬、关节酸痛，也在心底发誓绝不愿松手分离。",
                next: "s24"
            },
            "s24": {
                story: "回首这段荒唐而又不可思议的经历，从最初那个寻常的深夜，你天真地以为只要忍辱负重一晚就能结束一切；到白天在人来人往的写字楼办公室、在拥挤不堪的早高峰地铁里，你充满愤怒与恐惧，却又在身体的背叛下面临着随时可能社死崩溃的极致拉扯；再到最终彻底卸下心防，在周末的双人床上甘愿被绑缚、抛弃所有的尊严，彻底认命化身为深渊的专属信徒。\n\n这所有不可理喻、荒谬透顶的情欲场景，都被他用二十年积攒下来的病态爱意与幽暗的执念，一针一线地编织成了一张巨大且密不透风、令人无处可逃的网。\n\n“小主人，欢迎回家。认命吧，你永远、永远都只能属于我一个人，直到这具肉身腐坏，直到你的灵魂腐朽。”\n\n他低沉的嗓音犹如恶魔签下的最终契约。这份极度危险、足以毁灭一切，却又让人如吸食毒品般疯狂上瘾的情欲牢笼，将你温柔而残忍地永远锁死在其中。而你，在这场漫长且无可救药的调教中，早就已经心甘情愿地、亲手交出了那把唯一可以逃生的钥匙，沉溺其中，永生永世，再也不愿醒来。",
                prompt: "在脑海中如电影快进般，回顾从一开始天真地以为会结束、到疯狂抗拒、再到最终彻底堕落的所有场景画面。用手指综合所有的手法和节奏，从极轻柔的碾压研磨，逐渐过渡到最猛烈、毫无保留的贯穿。彻底放飞自我，身体随着节奏狂乱扭动，迎接这场最没有退路的最终高潮。深深感受这永恒牢笼带给你的、病态却极度安稳的满足感。闭上眼睛，嘴角勾起一抹彻底沉沦的微笑，低声呢喃，满心欢喜地接受这段病态的爱。",
                next: null
            }

        let currentId = "s0";
        let typingTimeout;
        let promptDelayTimeout;
        let lockClick = false; 
        let currentPhase = 'IDLE';
        let gameStarted = false;

        const storyContainer = document.getElementById('story-text');
        const scrollArea = document.getElementById('story-scroll-area');
        const promptBox = document.getElementById('prompt-box');
        const promptText = document.getElementById('prompt-text');
        const clickHint = document.getElementById('click-hint');
        const choicesContainer = document.getElementById('choices-container');

        function switchScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            for (let i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active');
            }
            document.getElementById(screenId).classList.add('active');
        }

        function startGame(event) {
            if (event) event.preventDefault();
            if (gameStarted) return;
            gameStarted = true;
            
            switchScreen('game-screen');
            setTimeout(() => {
                currentId = "s0";
                loadScene();
            }, 1000); 
        }

        function typeWriter(text, index, targetElement, speed, callback) {
            if (!text) {
                if (callback) callback();
                return;
            }
            if (index <= text.length) {
                targetElement.textContent = text.substring(0, index);
                index++;
                if (targetElement === storyContainer) scrollArea.scrollTop = scrollArea.scrollHeight;
                typingTimeout = setTimeout(() => typeWriter(text, index, targetElement, speed, callback), speed); 
            } else {
                if (callback) callback();
            }
        }

        function loadScene() {
            if (!scriptData[currentId]) return;
            
            lockClick = true; 
            setTimeout(() => { lockClick = false; }, 300); 

            const currentScene = scriptData[currentId];
            
            storyContainer.textContent = '';
            
            promptBox.style.opacity = '0';
            promptBox.style.transform = 'translateY(10px)';
            promptText.textContent = '';
            choicesContainer.classList.remove('active');
            choicesContainer.innerHTML = '';
            clickHint.style.opacity = '0';
            
            if (currentScene.choices) {
                promptBox.style.display = 'none'; 
                
                for (let i = 0; i < currentScene.choices.length; i++) {
                    const choice = currentScene.choices[i];
                    const btn = document.createElement('div');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = (e) => makeChoice(choice.next, e);
                    btn.ontouchstart = (e) => makeChoice(choice.next, e);
                    choicesContainer.appendChild(btn);
                }
            } else {
                promptBox.style.display = 'block'; 
            }
            
            currentPhase = 'STORY_TYPING';

            typeWriter(currentScene.story, 0, storyContainer, 25, () => {
                if (currentPhase === 'STORY_TYPING') {
                    if (currentScene.choices) {
                        showChoices(currentScene.choices);
                    } else {
                        startPromptPhase();
                    }
                }
            });
        }

        function showChoices(choices) {
            currentPhase = 'WAITING_FOR_CHOICE';
            choicesContainer.classList.add('active');
            clickHint.style.opacity = '0'; 
            scrollArea.scrollTop = scrollArea.scrollHeight;
        }

        function makeChoice(nextId, event) {
            if (event) event.stopPropagation(); 
            if (lockClick) return;
            lockClick = true;
            
            choicesContainer.classList.remove('active');
            currentId = nextId;
            setTimeout(() => { loadScene(); }, 400);
        }

        function startPromptPhase() {
            currentPhase = 'PROMPT_TYPING';
            const currentScene = scriptData[currentId];
            
            promptBox.style.opacity = '1';
            promptBox.style.transform = 'translateY(0)';
            
            promptDelayTimeout = setTimeout(() => {
                if (currentPhase !== 'PROMPT_TYPING') return;
                typeWriter(currentScene.prompt, 0, promptText, 35, () => {
                    if (currentPhase === 'PROMPT_TYPING') finishPhase();
                });
            }, 400); 
        }

        function finishPhase() {
            currentPhase = 'DONE';
            setTimeout(() => { clickHint.style.opacity = '1'; }, 200);
        }

        function scrambleReveal(element, finalText, delay) {
            const chars = '✦✧幻虚无灭死生魂念怨恨痴贪沉沦＠＃＄％＆＊＋？';
            setTimeout(() => {
                element.style.opacity = '1';
                let frame = 0; let length = finalText.length;
                let interval = setInterval(() => {
                    let finished = 0; let displayString = '';
                    for (let i = 0; i < length; i++) {
                        if (finalText[i] === ' ' || finalText[i] === '·') { displayString += finalText[i]; finished++; continue; }
                        let threshold = i * 4; 
                        if (frame >= threshold + 10) { displayString += finalText[i]; finished++; } 
                        else { displayString += chars[Math.floor(Math.random() * chars.length)]; }
                    }
                    element.textContent = displayString; frame++;
                    if (finished >= length) { clearInterval(interval); element.textContent = finalText; }
                }, 50);
            }, delay);
        }

        function showEndingScreen() {
            switchScreen('ending-screen');
            const cnText = document.getElementById('end-cn');
            const divider = document.getElementById('end-divider');
            const subText = document.getElementById('end-sub');
            const btn = document.getElementById('restart-btn');

            cnText.textContent = ''; subText.textContent = '';
            scrambleReveal(cnText, '我们要永远在一起', 800);
            setTimeout(() => { divider.style.animation = 'revealBleed 2s ease forwards'; }, 2500);
            scrambleReveal(subText, '契约已成 · 灵魂相融', 3800);
            setTimeout(() => { btn.style.animation = 'revealBleed 2s ease forwards'; }, 6500);
        }

        function restartGame(event) {
            if(event) event.stopPropagation(); 
            location.reload(); 
        }

        function handleGlobalClick(event) {
            if (lockClick) return; 
            if (currentPhase === 'WAITING_FOR_CHOICE') return; 

            if (currentPhase === 'STORY_TYPING') {
                clearTimeout(typingTimeout);
                const currentScene = scriptData[currentId];
                storyContainer.textContent = currentScene.story || "";
                scrollArea.scrollTop = scrollArea.scrollHeight;
                
                if (currentScene.choices) {
                    showChoices(currentScene.choices);
                } else {
                    startPromptPhase();
                }
                
                lockClick = true;
                setTimeout(() => { lockClick = false; }, 300);
                
            } else if (currentPhase === 'PROMPT_TYPING') {
                clearTimeout(typingTimeout);
                clearTimeout(promptDelayTimeout);
                
                promptBox.style.opacity = '1';
                promptBox.style.transform = 'translateY(0)';
                promptText.textContent = scriptData[currentId].prompt || "";
                
                finishPhase();
                lockClick = true;
                setTimeout(() => { lockClick = false; }, 300);
                
            } else if (currentPhase === 'DONE') {
                if (scriptData[currentId].next) {
                    currentId = scriptData[currentId].next;
                    loadScene();
                } else {
                    showEndingScreen();
                }
            }
        }

        const gameScreen = document.getElementById('game-screen');
        gameScreen.addEventListener('click', handleGlobalClick);
    </script>
