<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禁忌的忏悔录</title>
    <style>
        /* ================= 核心响应式变量 ================= */
        :root {
            --frame-out: 40px;
            --frame-in: 8px;
            --header-top: 85px;
            --text-pad-h: 120px;
            --text-pad-v: 140px;
            --font-size-story: 1.05em;
            --font-size-prompt: 0.9em;
            --line-height-story: 1.9;
            --letter-spacing-story: 1px;
            --prompt-padding: 30px 20px;
            --corner-size: 24px;
            --mid-size: 15px;
            
            /* ⭐️ 新增：密码页专属响应式变量 */
            --pwd-title-size: 1.6em;
            --pwd-title-ls: 4px;
            --pwd-subtitle-size: 0.8em;
            --pwd-subtitle-ls: 8px;
        }

        @media (max-width: 768px) {
            :root {
                --frame-out: 15px;
                --frame-in: 5px;
                --header-top: 45px;
                --text-pad-h: 45px;
                --text-pad-v: 100px;
                --font-size-story: 0.98em;
                --font-size-prompt: 0.85em;
                --line-height-story: 1.7;
                --letter-spacing-story: 0.5px;
                --prompt-padding: 20px 15px;
                --corner-size: 18px;
                --mid-size: 12px;
                
                /* ⭐️ 核心修复：手机端密码页标题自动收缩，防贴边 */
                --pwd-title-size: 1.3em;
                --pwd-title-ls: 3px;
                --pwd-subtitle-size: 0.6em;
                --pwd-subtitle-ls: 3px;
            }
        }

        /* ================= 基础全局设置 ================= */
        body {
            margin: 0;
            padding: 0;
            background-color: #F8F5F0; 
            color: #383229; 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
            font-weight: 400;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(179, 146, 78, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(179, 146, 78, 0.5); }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; height: 55vh;
            background: radial-gradient(ellipse at 50% -10%, rgba(218, 165, 32, 0.08) 0%, rgba(179, 146, 78, 0.03) 40%, transparent 70%);
            pointer-events: none;
            z-index: 9997;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(20, 15, 10, 0.06) 100%);
            pointer-events: none;
            z-index: 9998;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            padding: var(--text-pad-v) var(--text-pad-h);
            position: relative; 
        }

        /* ================= 鎏金花纹边框 ================= */
        .church-frame {
            position: fixed;
            top: var(--frame-out); bottom: var(--frame-out);
            left: var(--frame-out); right: var(--frame-out);
            border: 1px solid rgba(179, 146, 78, 0.25); 
            pointer-events: none; 
            z-index: 9999;
            transition: all 0.5s ease; 
        }
        
        .church-frame::before {
            content: "";
            position: absolute;
            top: var(--frame-in); bottom: var(--frame-in);
            left: var(--frame-in); right: var(--frame-in);
            border: 2px double rgba(179, 146, 78, 0.4); 
            box-shadow: inset 0 0 60px rgba(179, 146, 78, 0.03); 
            transition: all 0.5s ease;
        }
        
        .ornament-corner, .ornament-mid {
            position: absolute;
            font-family: "Georgia", "Times New Roman", serif; 
            background-color: transparent; 
            color: rgba(179, 146, 78, 0.6); 
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 
                0 0 3px #F8F5F0, 0 0 3px #F8F5F0, 
                0 0 8px #F8F5F0, 0 0 12px #F8F5F0; 
            transition: all 0.5s ease;
        }

        .ornament-corner { font-size: var(--corner-size); }
        .corner-tl { top: var(--frame-in); left: var(--frame-in); transform: translate(-50%, -50%); }
        .corner-tr { top: var(--frame-in); right: var(--frame-in); transform: translate(50%, -50%); }
        .corner-bl { bottom: var(--frame-in); left: var(--frame-in); transform: translate(-50%, 50%); }
        .corner-br { bottom: var(--frame-in); right: var(--frame-in); transform: translate(50%, 50%); }

        .ornament-mid { font-size: var(--mid-size); }
        .mid-top { top: var(--frame-in); left: 50%; transform: translate(-50%, -50%); }
        .mid-bottom { bottom: var(--frame-in); left: 50%; transform: translate(-50%, 50%); }
        .mid-left { top: 50%; left: var(--frame-in); transform: translate(-50%, -50%); }
        .mid-right { top: 50%; right: var(--frame-in); transform: translate(50%, -50%); }

        /* ================= 古典页眉 ================= */
        .page-header {
            position: fixed;
            top: var(--header-top);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 85%;
            max-width: 450px;
            z-index: 1;
            pointer-events: none;
        }

        .ph-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(179, 146, 78, 0.25) 50%, transparent);
        }

        .ph-text {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 0.65em;
            color: #A69D91;
            letter-spacing: 5px;
            margin: 0 15px;
            margin-right: 10px; 
            text-transform: uppercase;
            opacity: 0.75;
        }

        /* ================= 密码页样式 ================= */
        #password-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            z-index: 50;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            width: 100%;
            height: 100%;
        }

        .pwd-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatUp 1.5s ease-out forwards;
            width: 80%; /* 防止过宽 */
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .pwd-icon {
            color: #C0A16B;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 10px;
            text-shadow: 0 0 12px rgba(179, 146, 78, 0.5);
            display: flex;
            align-items: center;
        }

        .pwd-icon::before, .pwd-icon::after {
            content: "";
            display: block;
            width: 40px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(179, 146, 78, 0.4), transparent);
            margin: 0 15px;
        }

        .pwd-title {
            font-family: "Noto Serif CJK SC", "Songti SC", serif;
            font-size: var(--pwd-title-size);
            color: #383229;
            letter-spacing: var(--pwd-title-ls);
            margin: 0 0 12px 0;
            margin-right: calc(var(--pwd-title-ls) * -1); /* 自动抵消偏移 */
            font-weight: 400; 
            text-shadow: 0px 1px 2px rgba(56, 50, 41, 0.1);
            text-align: center;
        }

        .pwd-subtitle {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: var(--pwd-subtitle-size);
            color: #9c9284;
            letter-spacing: var(--pwd-subtitle-ls);
            margin: 0 0 45px 0;
            margin-right: calc(var(--pwd-subtitle-ls) * -1); /* 自动抵消偏移 */
            font-style: italic;
            text-transform: uppercase;
            position: relative;
            text-align: center;
        }

        .pwd-subtitle::after {
            content: "";
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 15px;
            background-color: rgba(179, 146, 78, 0.35);
        }

        #pwd-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(179, 146, 78, 0.3);
            color: #383229;
            font-size: 1.4em;
            text-align: center;
            width: 65%;
            max-width: 220px;
            padding: 10px 0;
            margin-top: 15px;
            margin-bottom: 40px;
            outline: none;
            letter-spacing: 12px; 
            font-family: inherit;
            transition: all 0.4s ease;
            user-select: text;
            -webkit-user-select: text;
        }

        #pwd-input:focus {
            border-bottom: 1px solid rgba(179, 146, 78, 0.8);
            transform: scale(1.02); 
        }

        #pwd-submit {
            font-family: "Noto Serif CJK SC", "Songti SC", serif;
            font-size: 0.85em;
            color: #C0A16B;
            letter-spacing: 8px;
            margin-right: -8px;
            padding: 12px 40px;
            background: transparent;
            border: 1px solid rgba(179, 146, 78, 0.15);
            border-radius: 1px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        #pwd-submit::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(179, 146, 78, 0.04);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s ease;
            z-index: -1;
        }

        #pwd-submit:hover::before, #pwd-submit:active::before {
            transform: scaleY(1);
        }

        #pwd-submit:hover, #pwd-submit:active {
            border-color: rgba(179, 146, 78, 0.6);
            color: #A68740;
            box-shadow: 0 0 15px rgba(179, 146, 78, 0.1);
        }

        #pwd-error {
            font-family: "Noto Serif CJK SC", "Songti SC", serif;
            font-size: 0.8em;
            color: #A35E5E;
            letter-spacing: 3px;
            margin-top: 25px;
            opacity: 0;
            transition: opacity 0.5s ease;
            height: 20px;
        }
        
        /* ================= 内容区排版 ================= */
        #game-container {
            width: 100%;
            max-width: 560px; 
            box-sizing: border-box;
            z-index: 1;
            display: none; 
            flex-direction: column;
            position: relative;
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
        }

        #story-text {
            font-size: var(--font-size-story); 
            line-height: var(--line-height-story); 
            letter-spacing: var(--letter-spacing-story); 
            min-height: 120px;
            margin-bottom: 50px; 
            text-align: justify;
            text-justify: inter-ideograph; 
            word-break: break-word; 
            text-shadow: 0px 0px 1px rgba(56, 50, 41, 0.15); 
            font-weight: 300; 
        }

        #prompt-box {
            position: relative;
            padding: var(--prompt-padding); 
            opacity: 0; 
            transform: translateY(15px); 
            transition: opacity 0.8s ease-out, transform 0.8s ease-out; 
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #prompt-box::before, #prompt-box::after {
            content: "";
            position: absolute;
            left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(179, 146, 78, 0.4), transparent);
        }
        #prompt-box::before { top: 0; }
        #prompt-box::after { bottom: 0; }

        #prompt-box.visible {
            opacity: 1;
            transform: translateY(0);
            background: radial-gradient(ellipse at center, rgba(179, 146, 78, 0.04) 0%, transparent 60%);
        }

        .prompt-icon {
            color: #C0A16B;
            font-size: 12px;
            margin-bottom: 12px;
            letter-spacing: 4px;
            opacity: 0;
            transition: opacity 1s ease-in;
        }
        #prompt-box.visible .prompt-icon { opacity: 0.8; }

        #prompt-text {
            color: #8A7F70; 
            font-size: var(--font-size-prompt);
            line-height: 1.8; 
            margin: 0;
            text-align: center; 
            letter-spacing: 1px; 
            font-weight: 400;
        }

        /* ================= 环形倒计时器 ================= */
        #timer-wrapper {
            position: relative;
            margin-top: 20px;
            width: 70px;
            height: 70px;
            display: none; 
            justify-content: center;
            align-items: center;
        }

        .timer-svg {
            position: absolute;
            top: 0; left: 0;
            transform: rotate(-90deg); 
            filter: drop-shadow(0 0 5px rgba(179, 146, 78, 0.3)); 
        }

        .timer-circle-bg {
            fill: none;
            stroke: rgba(179, 146, 78, 0.15); 
            stroke-width: 1.5;
        }

        .timer-circle-fg {
            fill: none;
            stroke: #C0A16B; 
            stroke-width: 1.5;
            stroke-linecap: round; 
            stroke-dasharray: 208; 
            stroke-dashoffset: 0; 
        }

        @keyframes drainRing {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 208; } 
        }

        #countdown-timer {
            font-family: "Georgia", serif; 
            font-style: italic; 
            font-size: 1.8em; 
            color: #C0A16B; 
            margin: 0;
            font-weight: normal; 
            letter-spacing: 0; 
            text-shadow: 0 0 10px rgba(179, 146, 78, 0.4); 
            line-height: 1; 
            transform: translateX(-2px); 
        }

        /* ================= 底部点击提示 ================= */
        #click-hint {
            position: fixed;
            bottom: max(35px, var(--frame-out) + 20px); 
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7em;
            color: #B0A89F; 
            transition: opacity 0.8s;
            z-index: 1;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            display: none; 
            opacity: 0;
        }

        .blinking {
            animation: blink 4s ease-in-out infinite; 
        }

        @keyframes blink {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.7; }
        }

        /* ================= 结局页面样式 ================= */
        #ending-screen {
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
            z-index: 10;
            text-align: center;
        }

        #ending-title {
            font-family: "Snell Roundhand", "Edwardian Script ITC", "Monotype Corsiva", "Apple Chancery", cursive;
            font-size: 4.5em; 
            color: #C0A16B;
            letter-spacing: 2px; 
            margin: 0 0 10px 0;
            font-weight: normal;
            text-shadow: 0 0 15px rgba(179, 146, 78, 0.4);
        }

        #ending-subtitle {
            font-family: "Noto Serif CJK SC", "Songti SC", serif; 
            font-size: 1.1em;
            color: #8A7F70;
            letter-spacing: 4px;
            margin: 0;
            margin-right: -4px;
        }

        #restart-btn {
            font-size: 0.85em;
            color: #C0A16B;
            letter-spacing: 4px;
            padding: 8px 25px;
            margin-top: 50px;
            border: 1px solid rgba(179, 146, 78, 0.2);
            border-radius: 2px;
            transition: all 0.5s ease;
            text-transform: uppercase;
            opacity: 0; 
            cursor: pointer;
        }

        #restart-btn:hover, #restart-btn:active {
            background-color: rgba(179, 146, 78, 0.05);
            border-color: rgba(179, 146, 78, 0.5);
        }

        /* ================= 分支按钮样式 ================= */
        .choice-btn {
            margin: 15px auto;
            padding: 12px 20px;
            border: 1px solid rgba(179, 146, 78, 0.4);
            color: #C0A16B;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-family: "Noto Serif CJK SC", "Songti SC", serif;
            width: 80%;
            background: rgba(179, 146, 78, 0.05);
        }

        .choice-btn:hover {
            background: rgba(179, 146, 78, 0.15);
            border-color: rgba(179, 146, 78, 0.8);
        }
    </style>
</head>
<body>

    <div class="church-frame">
        <div class="ornament-corner corner-tl">⚜</div>
        <div class="ornament-corner corner-tr">⚜</div>
        <div class="ornament-corner corner-bl">⚜</div>
        <div class="ornament-corner corner-br">⚜</div>
        
        <div class="ornament-mid mid-top">♦</div>
        <div class="ornament-mid mid-bottom">♦</div>
        <div class="ornament-mid mid-left">♦</div>
        <div class="ornament-mid mid-right">♦</div>
    </div>

    <div id="game-wrapper">
        
        <div class="page-header">
            <div class="ph-line"></div>
            <div class="ph-text">Liber I ✦ Confessio</div>
            <div class="ph-line"></div>
        </div>
        
        <div id="password-screen">

                <div class="pwd-icon">✦</div>
                <h2 class="pwd-title">禁忌的忏悔录</h2>

                <input type="password" id="pwd-input" autocomplete="off" maxlength="8" />

                <div id="pwd-error">秘钥不正确</div>

        </div>

        <div id="game-container">
            <div id="story-text"></div>
            
            <div id="prompt-box">

                <div id="timer-wrapper">

                    <div id="countdown-timer"></div>

        <div id="ending-screen">

            <div id="restart-btn">重新开启</div>
        </div>
    </div>

    <div id="click-hint" class="blinking">点击屏幕继续</div>

    <script>
       const scriptData = [

                clickHint.classList.remove('blinking');
                clickHint.style.opacity = 0.3;
                window.scrollTo(0, document.body.scrollHeight);

                timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        timerDisplay.innerHTML = timeLeft;
                    } else {
                        clearInterval(timerInterval);
                        isCountingDown = false;
                        timerWrapper.style.display = 'none'; 
                        
                        clickHint.innerHTML = "点击屏幕继续";
                        clickHint.classList.add('blinking');
                    }
                }, 1000);
            } else {
                timerWrapper.style.display = 'none';
                
                if (currentIndex === scriptData.length - 1) {
                    clickHint.innerHTML = "点击屏幕结束";
                } else {
                    clickHint.innerHTML = "点击屏幕继续";
                }
                clickHint.classList.add('blinking');
                clickHint.style.opacity = 1;
            }
        }

        function startPromptProcess(scene) {
            promptBox.classList.add('visible'); 
            isPromptTyping = true;
            
            setTimeout(() => {
                typeWriterPrompt(scene.prompt, 0, 50, () => {
                    startTimerIfAny(scene); 
                });
            }, 500);
        }

        function loadScene() {
            if (currentIndex >= scriptData.length) return;
            const currentScene = scriptData[currentIndex];
            
            storyContainer.innerHTML = '';
            promptBox.classList.remove('visible'); 
            promptText.innerHTML = '';
            choiceContainer.innerHTML = '';
            timerWrapper.style.display = 'none'; 
            window.scrollTo(0, 0); 
            
            clearInterval(timerInterval);
            if(timerPath) timerPath.style.animation = 'none'; 
            
            isStoryTyping = true;
            isPromptTyping = false;
            isCountingDown = false;
            isChoiceMade = false; 

            typeWriterStory(currentScene.story, 0, 40, () => {
                if (currentScene.choices) {
                    showChoices(currentScene);
                } else {
                    startPromptProcess(currentScene);
                }
            });
        }

        function triggerEnding() {
            isGameEnded = true; 
            
            gameContainer.style.opacity = 0;
            clickHint.style.opacity = 0;
            
            setTimeout(() => {
                gameContainer.style.display = 'none'; 
                
                endingScreen.style.display = 'flex'; 
                endingScreen.offsetHeight; 
                endingScreen.style.opacity = 1; 
                
                setTimeout(() => {
                    restartBtn.style.opacity = 1;
                }, 1500);

            }, 1500);
        }

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            
            endingScreen.style.opacity = 0;
            restartBtn.style.opacity = 0; 
            
            setTimeout(() => {
                endingScreen.style.display = 'none';
                
                currentIndex = 0;
                isGameStarted = false;
                isGameEnded = false;
                
                pwdInput.value = '';
                pwdScreen.style.display = 'flex';
                pwdScreen.offsetHeight;
                pwdScreen.style.opacity = 1;
                pwdInput.disabled = false;
                
            }, 1000); 
        });

        document.body.addEventListener('click', (e) => {
            if (!isGameStarted || isGameEnded) return; 
            
            if (window.getSelection().toString().length > 0) return;
            if (isCountingDown) return; 

            if (isStoryTyping) {
                isStoryTyping = false;
                storyContainer.innerHTML = scriptData[currentIndex].story.replace(/\n/g, '<br>');
                
                if (scriptData[currentIndex].choices && !isChoiceMade) {
                    showChoices(scriptData[currentIndex]);
                } else {
                    startPromptProcess(scriptData[currentIndex]);
                }
                setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
            } else if (isPromptTyping) {
                isPromptTyping = false;
                promptText.innerHTML = scriptData[currentIndex].prompt;
                startTimerIfAny(scriptData[currentIndex]);
                setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
            } else {
                if (scriptData[currentIndex].choices && !isChoiceMade) return;

                if (currentIndex < scriptData.length - 1) {
                    currentIndex++;
                    loadScene();
                } else {
                    triggerEnding();
                }
            }
        });
    </script>
</body>
</html>
